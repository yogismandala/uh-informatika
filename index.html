            async function resetSiswaLogin(usernameSiswa, isBulk = false) {
                // ✅ PERUBAHAN 2: Jika isBulk = true, lewati confirm popup
                if (!isBulk) {
                    const result = await Swal.fire({
                        title: 'Reset Sesi Login?',
                        text: `Yakin ingin mereset sesi login untuk siswa: ${usernameSiswa}?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#f59e0b',
                        confirmButtonText: 'Ya, Reset!',
                        cancelButtonText: 'Batal'
                    });
                    if (!result.isConfirmed) return;
                }

                if (!isBulk && typeof showLoading === 'function') showLoading();
                
                try {
                    const { error } = await dbClient
                        .from('users')
                        .update({ is_login: false })
                        .eq('username', usernameSiswa);

                    if (!isBulk && typeof hideLoading === 'function') hideLoading();

                    if (error) {
                        console.error("Error mereset login:", error);
                        // ✅ PERUBAHAN 3: Sembunyikan alert satuan jika sedang reset massal
                        if (!isBulk) {
                            Swal.fire('Gagal!', 'Gagal mereset sesi siswa.', 'error');
                        }
                    } else {
                        // ✅ PERUBAHAN 4: Sembunyikan alert sukses satuan jika sedang reset massal
                        if (!isBulk) {
                            Swal.fire('Berhasil!', `Sesi untuk ${usernameSiswa} telah direset. Siswa bisa login kembali.`, 'success');
                            refreshTarget('users'); 
                        }
                    }
                } catch (err) {
                    if (!isBulk && typeof hideLoading === 'function') hideLoading();
                    console.error("Terjadi kesalahan:", err);
                    if (!isBulk) alert("Gagal terhubung ke server.");
                }
            }

            if (typeof window.currentUserFilter === 'undefined') {

            // Menangani perubahan input pencarian nama pengguna + menampilkan saran (suggestion)
            function handleUserSearchInput(value) {
                window.currentUserSearch = value;
                renderUsersSection();

                const suggestionBox = document.getElementById('userSearchSuggestions');
                if (!suggestionBox) return;

                const keyword = value.trim().toLowerCase();
                if (keyword === '') {
                    suggestionBox.innerHTML = '';
                    suggestionBox.style.display = 'none';
                    return;
                }

                // Ambil nama unik yang cocok dengan keyword, maksimal 6 saran
                const matches = allUsers
                    .filter(u => u.role === 'siswa' && u.name && u.name.toLowerCase().includes(keyword))
                    .slice(0, 6);

                if (matches.length === 0) {
                    suggestionBox.innerHTML = `<div class="px-3 py-2 text-xs text-gray-400">Tidak ada nama yang cocok</div>`;
                    suggestionBox.style.display = 'block';
                    return;
                }

                suggestionBox.innerHTML = matches.map(u => {
                    // Highlight bagian nama yang cocok dengan keyword
                    const idx = u.name.toLowerCase().indexOf(keyword);
                    const before = u.name.slice(0, idx);
                    const match = u.name.slice(idx, idx + keyword.length);
                    const after = u.name.slice(idx + keyword.length);
                    return `
                        <div onclick="selectUserSuggestion('${u.name.replace(/'/g, "\\'")}')" 
                            class="px-3 py-2 text-xs md:text-sm cursor-pointer hover:bg-blue-50 flex items-center gap-2 border-b border-gray-100 last:border-b-0">
                            <span>👤</span>
                            <span>${before}<b class="text-blue-600">${match}</b>${after}</span>
                            <span class="ml-auto text-[10px] text-gray-400">${u.class || ''}</span>
                        </div>
                    `;
                }).join('');
                suggestionBox.style.display = 'block';
            }

            // Ketika salah satu saran diklik, isi kotak pencarian dan filter tabel
            function selectUserSuggestion(name) {
                const input = document.getElementById('userSearchInput');
                if (input) input.value = name;
                window.currentUserSearch = name;

                const suggestionBox = document.getElementById('userSearchSuggestions');
                if (suggestionBox) {
                    suggestionBox.innerHTML = '';
                    suggestionBox.style.display = 'none';
                }

                renderUsersSection();
            }

            // Mengosongkan pencarian
            function clearUserSearch() {
                window.currentUserSearch = '';
                const input = document.getElementById('userSearchInput');
                if (input) input.value = '';
                const suggestionBox = document.getElementById('userSearchSuggestions');
                if (suggestionBox) {
                    suggestionBox.innerHTML = '';
                    suggestionBox.style.display = 'none';
                }
                renderUsersSection();
            }

            // Tutup dropdown saran jika klik di luar area pencarian
            document.addEventListener('click', function(e) {
                const wrapper = document.getElementById('userSearchWrapper');
                const suggestionBox = document.getElementById('userSearchSuggestions');
                if (wrapper && suggestionBox && !wrapper.contains(e.target)) {
                    suggestionBox.style.display = 'none';
                }
            });

            // Fungsi Reset Massal yang AMAN tanpa merusak tombol tabel satuan
            async function resetAllOnlineUsers() {
                const onlineUsers = allUsers.filter(user => user.role === 'siswa' && user.is_login);
                
                if (onlineUsers.length === 0) {
                    if (typeof Swal !== 'undefined') {
                        Swal.fire('Info', 'Tidak ada siswa yang sedang aktif/online saat ini.', 'info');
                    } else {
                        alert("Tidak ada siswa yang sedang aktif/online saat ini.");
                    }
                    return;
                }

                // 1. Variabel penampung hasil konfirmasi
                let isConfirmed = false;

                // 2. Munculkan konfirmasi dengan SweetAlert jika tersedia, atau confirm bawaan jika tidak
                if (typeof Swal !== 'undefined') {
                    const result = await Swal.fire({
                        title: 'Konfirmasi Reset Massal',
                        text: `Apakah Anda yakin ingin mereset login untuk ${onlineUsers.length} siswa yang sedang aktif secara bersamaan?`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33', // Warna merah karena ini aksi destruktif
                        cancelButtonColor: '#3085d6', // Warna biru untuk batal
                        confirmButtonText: 'Ya, Reset Semua!',
                        cancelButtonText: 'Batal'
                    });
                    isConfirmed = result.isConfirmed; // Bernilai true jika tombol 'Ya' diklik
                } else {
                    isConfirmed = confirm(`Apakah Anda yakin ingin mereset login untuk ${onlineUsers.length} siswa yang sedang aktif secara bersamaan?`);
                }

                // 3. Jika pengguna mengonfirmasi (isConfirmed = true), jalankan eksekusi
                if (isConfirmed) {
                    
                    // Tampilkan loading global untuk proses bulk
                    if (typeof showLoading === 'function') showLoading();

                    try {
                        // Panggil fungsi satuan dengan isBulk = true (supaya tidak muncul popup lagi)
                        for (const user of onlineUsers) {
                            await resetSiswaLogin(user.username, true);
                        }
                        
                        // Berikan alert sukses SATU KALI di akhir
                        if (typeof Swal !== 'undefined') {
                            Swal.fire('Berhasil!', 'Semua status login siswa aktif telah direset.', 'success');
                        } else {
                            alert("Berhasil meriset status login semua siswa yang aktif.");
                        }
                        
                        // Refresh tabel & target setelah semua proses selesai
                        if (typeof renderUsersSection === 'function') renderUsersSection(); 
                        if (typeof refreshTarget === 'function') refreshTarget('users');

                    } catch (error) {
                        console.error("Gagal meriset beberapa pengguna:", error);
                        if (typeof Swal !== 'undefined') {
                            Swal.fire('Error', 'Terjadi kesalahan saat melakukan reset massal.', 'error');
                        } else {
                            alert("Terjadi kesalahan saat melakukan reset massal.");
                        }
                    } finally {
                        // Matikan loading global
                        if (typeof hideLoading === 'function') hideLoading();
                    }
                }
            }

            //untuk hasil nilai

                // 1. Ambil list kelas unik
                const uniqueClasses = [...new Set(allExamResults.map(item => item.student_class))].sort();            
                return uniqueClasses.map(c => {
                    // --- PEMBERSIHAN DATA ---
                    // Ubah data kelas (c) menjadi String dan buang spasi (trim)
                    const classValue = String(c || "").trim();
                    
                    // Ubah state yang dipilih menjadi String dan buang spasi (trim)
                    const selectedValue = String(filterState.class || "").trim();

                    // --- BANDINGKAN ---
                    // Jika nilainya sama persis, tambahkan atribut 'selected'
                    const isSelected = (classValue === selectedValue) ? 'selected' : '';

                    // Return HTML Option
                    return `<option value="${classValue}" ${isSelected}>${classValue}</option>`;
                }).join('');

                let options = '';

            async function clearAllResults() {

                    title: '⚠️ Hapus Semua Data?',
                    text: 'Aksi ini tidak dapat dibatalkan!',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    confirmButtonText: 'Ya, Hapus!',
                    cancelButtonText: 'Batal'
                });
                if (!isConfirmed) return;

                try {
                    if (typeof showLoading === 'function') showLoading();

                    // 1. HAPUS DARI SUPABASE (Perintah lebih aman)
                    const { error } = await dbClient
                        .from('examresult') // <--- GANTI INI DENGAN NAMA TABEL ASLI KAMU
                        .delete()
                        .not('id', 'is', null); // <--- Memilih semua baris tanpa terpengaruh tipe data ID

                    if (error) throw error;

                    // 2. KOSONGKAN ARRAY LOKAL (Anti error const)

                    // 3. UPDATE TAMPILAN
                    if (typeof showToast === 'function') {
                        showToast('Semua data hasil ujian berhasil dibersihkan!', 'success');

                        alert('Semua data berhasil dibersihkan!');

                    renderResultsSection();

                    console.error("Gagal membersihkan data:", error);
                    
                    // Tampilkan pesan error agar kita tahu apa masalah sebenarnya
                    if (typeof showToast === 'function') {
                        showToast('Gagal: ' + error.message, 'error');
                    } else {
                        alert('Gagal membersihkan data: ' + error.message);
                    }
                    
                } finally {
                    if (typeof hideLoading === 'function') hideLoading();
                }
            }

            function downloadExcel() {
                if (!allExamResults || allExamResults.length === 0) {
                    // Asumsi showToast sudah didefinisikan sebelumnya
                    if (typeof showToast === 'function') showToast('Tidak ada data untuk didownload', 'error');
                    else alert('Tidak ada data untuk didownload');
                    return;
                }
                
                const dataToExport = getProcessedData();
                if (dataToExport.length === 0) {
                    Swal.fire('Info', 'Tidak ada data yang sesuai filter untuk diunduh.', 'info');
                    return;
                }

                // 1. Siapkan data
                const formattedData = dataToExport.map((item, index) => {
                    // Ambil waktu dari database, beri nilai "-" jika kosong
                    let jamLogin = item.waktu_login ? item.waktu_login : "-";
                    
                    // Untuk waktu selesai, kita prioritaskan item.waktu_selesai. 
                    // Jika tidak ada, kita fallback mengambil dari item.exam_time (timestamp submit)
                    let jamSelesai = item.waktu_selesai ? item.waktu_selesai : 
                                    (item.exam_time ? new Date(item.exam_time).toLocaleTimeString('id-ID') : "-");

                    return {
                        "No": index + 1,
                        "Nama Siswa": item.student_name,
                        "Kelas": item.student_class,
                        "Mata Pelajaran": item.exam_subject,
                        "Skor": item.final_score,
                        "Waktu Login": jamLogin,     // <--- KOLOM BARU DITAMBAHKAN
                        "Waktu Selesai": jamSelesai, // <--- KOLOM BARU DITAMBAHKAN
                        "Pelanggaran": item.violations || 0
                    };
                });

                // 3. Buat Nama File Dinamis
                let fileName = "Hasil_Ujian";
                if (filterState.class) fileName += `_Kelas_${filterState.class}`;
                if (filterState.subject) fileName += `_${filterState.subject}`;
                fileName += ".xlsx";

                // 4. Proses Pembuatan File Excel (SheetJS)
                const worksheet = XLSX.utils.json_to_sheet(formattedData);
                const workbook = XLSX.utils.book_new();

                // Mengatur lebar kolom agar rapi (Menambahkan 2 kolom waktu)
                const wscols = [
                    {wch: 5},  // No
                    {wch: 30}, // Nama Siswa
                    {wch: 10}, // Kelas
                    {wch: 20}, // Mata Pelajaran
                    {wch: 10}, // Skor
                    {wch: 15}, // Waktu Login (Baru)
                    {wch: 15}, // Waktu Selesai (Baru)
                    {wch: 15}  // Pelanggaran
                ];
                worksheet['!cols'] = wscols;

                XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil Ujian");
                XLSX.writeFile(workbook, fileName);            
            }

                    }
                    if (window.selectedBankSoalClass) {

                    }
                } else {

                    questionsToRender = questionsToRender.filter(q => {

                    }).length;

                // Fungsi urutan: kelompokkan per Mapel (A-Z), soal dalam mapel yang sama diurutkan berdasarkan ID (lama ke baru)
                const sortBySubject = (a, b) => {
                    const subA = (a.subject || '').toLowerCase();
                    const subB = (b.subject || '').toLowerCase();
                    if (subA !== subB) return subA.localeCompare(subB);
                    return (a.id > b.id) ? 1 : (a.id < b.id ? -1 : 0);
                };
                const questionsByGrade = {
                    '7': questionsToRender.filter(q => q.question_class && q.question_class.startsWith('7')).sort(sortBySubject),
                    '8': questionsToRender.filter(q => q.question_class && q.question_class.startsWith('8')).sort(sortBySubject),

            function showQuestionDetail(q) {
                // 1. AMBIL DAN DECODE KUNCI JAWABAN
                let kunciRaw = '';
                try {
                    kunciRaw = q.security_token 
                        ? decodeURIComponent(escape(atob(q.security_token))).trim() 
                        : String(q.correct_answer || q.answer_key || '').trim();
                } catch (e) { 
                    kunciRaw = String(q.correct_answer || '').trim(); 
                }

                // 2. FUNGSI PEMBERSIH BARU (LEBIH AMAN)
                const cleanText = (str) => {
                    if (str === null || str === undefined) return "";
                    str = String(str);
                    let tmp = document.createElement("DIV");
                    tmp.innerHTML = str;
                    let text = (tmp.textContent || tmp.innerText || "").trim();

                    // UBAH: Kalau opsi cuma gambar (tidak ada teks sama sekali),
                    // pakai src gambar sebagai identitas opsi, bukan dibiarkan kosong.
                    if (text === "") {
                        const img = tmp.querySelector('img');
                        if (img && img.getAttribute('src')) {
                            text = img.getAttribute('src').trim();
                        }
                    }

                    return text.toUpperCase().replace(/\s+/g, ' ').trim();
                };

                const kunciBersihTotal = cleanText(kunciRaw);
                const daftarKunciArray = kunciBersihTotal.split(',').map(k => k.trim());

                // 3. PROSES OPSI JAWABAN
                let optionsArray = [];
                try {
                    if (typeof q.options === 'string' && q.options.trim() !== '') {
                        optionsArray = JSON.parse(q.options);
                    } else if (Array.isArray(q.options)) {
                        optionsArray = q.options;
                    }
                } catch (e) { optionsArray = []; }

                let contentHtml = '';

                // CASE A: JIKA SOAL PILIHAN GANDA / KOMPLEKS
                if (optionsArray && optionsArray.length > 0) {
                    contentHtml += '<div class="space-y-2 mt-3 text-left">';
                    
                    // LOGIKA BARU: Cek apakah ada opsi yang identik 100% dengan kunci jawaban (Mencegah bug 23,5 vs 23)
                    const hasExactTextMatch = optionsArray.some(opt => cleanText(opt) === kunciBersihTotal);

                    optionsArray.forEach((opt, idx) => {
                        const label = String.fromCharCode(65 + idx).toUpperCase(); 
                        const opsiBersih = cleanText(opt);
                        
                        let isCorrect = false;
                        
                        if (opsiBersih !== "") {
                            if (hasExactTextMatch) {
                                // Jika ada match 100%, JANGAN gunakan pecahan koma. Fokus ke Exact Match!
                                if (opsiBersih === kunciBersihTotal) {
                                    isCorrect = true;
                                }
                            } else {
                                // Mode Fleksibel: Digunakan HANYA jika kuncinya format "A, B" atau "1, 2"
                                if (daftarKunciArray.includes(opsiBersih)) {
                                    isCorrect = true;
                                } else if (kunciBersihTotal === label || daftarKunciArray.includes(label)) {
                                    isCorrect = true;
                                } else if (daftarKunciArray.includes(String(idx)) || daftarKunciArray.includes(String(idx + 1))) {
                                    isCorrect = true;
                                }
                            }
                        }

                        contentHtml += `
                            <div class="px-3 py-2 rounded border-2 transition-all ${isCorrect ? 'border-green-500 bg-green-50 shadow-sm' : 'border-gray-200 bg-white'}">
                                <div class="flex items-center gap-3">
                                    <span class="w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-md font-bold text-xs ${isCorrect ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-500'}">
                                        ${label}
                                    </span>
                                    <div class="quill-content-render flex-1 text-sm ${isCorrect ? 'text-green-900 font-bold' : 'text-gray-700'}">
                                        ${opt}
                                    </div>
                                    ${isCorrect ? '<b class="text-green-600 ml-2 text-xl">✓</b>' : ''}
                                </div>
                            </div>`;
                    });
                    contentHtml += '</div>';
                } 
                // CASE B: JIKA SOAL ISIAN SINGKAT
                else {
                    contentHtml = `
                        <div class="mt-4">
                            <div class="text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-widest">Jawaban Benar:</div>
                            <div class="p-4 bg-green-100 border-2 border-green-500 rounded-xl text-green-900 font-bold text-lg text-center shadow-inner">
                                ${kunciRaw}
                            </div>
                        </div>`;
                }

                // 4. TAMPILKAN MODAL
                Swal.fire({
                    title: '<div class="text-lg font-bold text-gray-700">Detail Soal</div>',
                    html: `
                        <div class="text-left">
                            <div class="mb-4 p-3 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg">
                                <div class="text-[10px] font-bold text-blue-400 uppercase mb-1">Pertanyaan:</div>
                                <div class="quill-content-render text-gray-800 text-sm leading-relaxed" style="white-space: pre-wrap;">${q.question_text}</div>
                                ${q.question_image ? `<img src="${q.question_image}" class="mt-3 rounded-lg max-w-full h-auto mx-auto border shadow-sm block">` : ''}
                            </div>                            
                            
                            <div class="flex justify-between items-center mb-1">
                                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Opsi Jawaban:</div>
                                <div class="text-[9px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold uppercase">Kunci: ${kunciRaw}</div>
                            </div>

                            ${contentHtml}

                            <div class="mt-4 p-2 bg-gray-50 rounded border border-gray-100 text-[10px] text-gray-500 flex justify-between uppercase font-bold tracking-tighter">
                                <span>Kelas: ${q.question_class || '-'}</span>
                                <span>Mapel: ${q.subject || '-'}</span>
                            </div>
                        </div>`,
                    width: '550px',
                    confirmButtonText: 'Tutup',
                    confirmButtonColor: '#2563eb',
                    heightAuto: false,
                    didOpen: () => renderMathIn(Swal.getHtmlContainer())
                });
            }
