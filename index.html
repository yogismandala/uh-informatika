            // Mengubah "1" / "31" dsb menjadi angka, dan huruf opsi "a"/"A" menjadi index 0-3
            function letterToIndex(letter) {
                return String(letter).trim().toUpperCase().charCodeAt(0) - 65;
            }

            // Menghapus N karakter pertama dari sebuah elemen DOM TANPA merusak tag di
            // dalamnya (bold/italic tetap utuh). Dipakai untuk membuang prefix nomor soal
            // ("1. ") atau huruf opsi ("a. ") dari HTML, bukan dari teks polos, supaya
            // format yang menempel pada isi soal/opsi tidak ikut hilang.
            function stripLeadingChars(el, count) {
                if (count <= 0) return;
                const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                let remaining = count;
                let node;
                while (remaining > 0 && (node = walker.nextNode())) {
                    const len = node.textContent.length;
                    if (len <= remaining) {
                        node.textContent = '';
                        remaining -= len;
                    } else {
                        node.textContent = node.textContent.slice(remaining);
                        remaining = 0;
                    }
                }
            }

            // Membuang spasi/enter kosong di awal & akhir sebuah elemen DOM (tanpa
            // menyentuh teks di tengah), supaya panjang teks match persis dengan hasil
            // .textContent.trim() saat dipakai untuk menghitung prefix di stripLeadingChars.
            function trimDomWhitespace(el) {
                let walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                let node;
                while ((node = walker.nextNode())) {
                    const stripped = node.textContent.replace(/^[\s\u00A0]+/, '');
                    if (stripped !== node.textContent) node.textContent = stripped;
                    if (node.textContent.length > 0) break;
                }
                const textNodes = [];
                walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                while ((node = walker.nextNode())) textNodes.push(node);
                for (let i = textNodes.length - 1; i >= 0; i--) {
                    const n = textNodes[i];
                    const stripped = n.textContent.replace(/[\s\u00A0]+$/, '');
                    if (stripped !== n.textContent) n.textContent = stripped;
                    if (n.textContent.length > 0) break;
                }
            }

            // TOMBOL RUMUS DI TOOLBAR QUILL: Akar, Pangkat, Pecahan.
            function insertMathTemplate(quillInstance, buildLatex) {
                const range = quillInstance.getSelection(true) || { index: quillInstance.getLength(), length: 0 };
                const selectedText = range.length > 0 ? quillInstance.getText(range.index, range.length) : '';
                const { latex, cursorOffset } = buildLatex(selectedText);
                quillInstance.deleteText(range.index, range.length, 'user');
                quillInstance.insertText(range.index, latex, 'user');
                quillInstance.setSelection(range.index + cursorOffset, 0, 'user');
            }

            const mathToolbarHandlers = {
                sqrt: function () {
                    insertMathTemplate(this.quill, (sel) => {
                        const latex = sel ? `\\(\\sqrt{${sel}}\\)` : `\\(\\sqrt{}\\)`;
                        return { latex, cursorOffset: sel ? latex.length : latex.length - 2 };
                    });
                },
                power: function () {
                    const current = this.quill.getFormat();
                    this.quill.format('script', current.script === 'super' ? false : 'super');
                },
                fraction: function () {
                    insertMathTemplate(this.quill, (sel) => {
                        const latex = sel ? `\\(\\frac{${sel}}{}\\)` : `\\(\\frac{}{}\\)`;
                        return { latex, cursorOffset: latex.length - 3 };
                    });
                },
                table: function () {
                    openTableEditorDialog(this.quill, null);
                }
            };

            function tablePlaceholderText(id) {
                return `📊 [TABEL ${id}] (klik 2x untuk edit)`;
            }

            // FITUR "RAPIKAN DIALOG/CERITA"
            function parseDialogTextIntoRows(text) {
                const lines = String(text || '').split(/\r?\n/);
                const speakerRe = /^([A-Za-z][A-Za-z.'-]{0,20}(?:\s+[A-Za-z][A-Za-z.'-]{0,20}){0,3})\s*[:\t]\s*:?\s*(.*)$/;
                const closingQuoteRe = /["'\u201d\u2019]\s*[.!?]*$/; // ucapan sebelumnya sudah diakhiri tanda kutip penutup
                const rows = [];

                lines.forEach(rawLine => {
                    const line = rawLine.trim().replace(/\s+/g, ' ');
                    if (!line) return;

                    if (/^\(.*\)$/.test(line)) {
                        rows.push({ speaker: '', text: line });
                        return;
                    }

                    const m = line.match(speakerRe);
                    if (m && m[1].trim().length > 0) {
                        rows.push({ speaker: m[1].trim(), text: m[2].trim() });
                        return;
                    }

                    const prevRow = rows[rows.length - 1];
                    const prevSudahTertutup = prevRow && closingQuoteRe.test(prevRow.text);
                    if (prevRow && !prevSudahTertutup) {
                        prevRow.text = (prevRow.text + ' ' + line).trim();
                    } else {
                        rows.push({ speaker: '', text: line });
                    }
                });

                return rows;
            }

            // BARU: pantau blok teks supaya tidak hilang saat fokus pindah ke tombol.
            function attachDialogSelectionTracker(quillInstance) {
                if (!quillInstance || quillInstance.__dialogSelectionTrackerAttached) return;
                quillInstance.__dialogSelectionTrackerAttached = true;
                quillInstance.__lastDialogSelection = null;
                quillInstance.on('selection-change', function (range) {
                    if (range && range.length > 0) {
                        quillInstance.__lastDialogSelection = { index: range.index, length: range.length };
                    } else if (range !== null) {
                        quillInstance.__lastDialogSelection = null;
                    }
                });
            }

            // Susun baris {speaker, text} jadi HTML paragraf dengan "hanging indent":
            function buildAlignedDialogueHtml(rows) {
                const maxLen = rows.reduce((m, r) => r.speaker ? Math.max(m, r.speaker.length) : m, 0);
                const indentCh = maxLen + 3; // panjang "Nama" (di-pad) + " : "
                const baseStyle = "margin:0 0 6px 0; font-family:'Courier New', Courier, monospace; " +
                    "white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; " +
                    "background: transparent; text-align: left;";

                return rows.map(r => {
                    if (!r.speaker) {
                        return `<p style="${baseStyle}">${escapeHtmlText(r.text)}</p>`;
                    }
                    const paddedName = r.speaker.padEnd(maxLen, ' ');
                    const lineText = escapeHtmlText(`${paddedName} : ${r.text}`);
                    const hangingStyle = `${baseStyle} padding-left: ${indentCh}ch; text-indent: -${indentCh}ch;`;
                    return `<p style="${hangingStyle}">${lineText}</p>`;
                }).join('');
            }

            // Handler tombol "Rapikan Dialog/Cerita".
            // Kalau ada teks yang diblok, HANYA itu yang dirapikan; kalau tidak,
            // seluruh isi kolom Pertanyaan yang dirapikan.
            function rapikanDialogInEditor(scope) {
                const editors = scope === 'edit' ? window.editEditors : window.addEditors;
                const quillInstance = editors && editors.question;
                if (!quillInstance) return;

                // PENTING: kalau tidak ada blok sama sekali, activeSelection harus NULL
                // (bukan diisi "seluruh dokumen"), supaya hasSelection tidak salah kebaca true.
                const liveSelection = quillInstance.getSelection();
                const cachedSelection = quillInstance.__lastDialogSelection;
                const activeSelection =
                    (liveSelection && liveSelection.length > 0) ? liveSelection :
                    (cachedSelection && cachedSelection.length > 0) ? cachedSelection :
                    null;

                const hasSelection = !!activeSelection;
                const rangeIndex = hasSelection ? activeSelection.index : 0;
                const rangeLength = hasSelection ? activeSelection.length : quillInstance.getLength();
                quillInstance.__lastDialogSelection = null;

                const rawText = quillInstance.getText(rangeIndex, rangeLength);
                const rows = parseDialogTextIntoRows(rawText);

                if (rows.length < 2) {
                    alert(hasSelection
                        ? 'Tidak terdeteksi pola dialog (Nama : ucapan) yang cukup pada teks yang diblok. Pastikan setiap baris berbentuk "Nama : ucapan" lalu coba lagi.'
                        : 'Tidak terdeteksi pola dialog (Nama : ucapan) yang cukup pada teks soal ini. Pastikan setiap baris berbentuk "Nama : ucapan" lalu coba lagi.');
                    return;
                }

                const scopeLabel = hasSelection ? 'Teks yang diblok' : 'Seluruh isi kolom Pertanyaan';
                const ok = confirm(`Ditemukan ${rows.length} baris dialog. ${scopeLabel} akan diganti dengan versi teks sejajar (kolom pakai spasi). Lanjutkan?`);
                if (!ok) return;

                const html = buildAlignedDialogueHtml(rows);

                if (hasSelection) {
                    // Manipulasi DOM langsung (BUKAN lewat clipboard), supaya gaya kustom
                    // kita tidak ikut disaring/dibuang oleh mekanisme "paste" bawaan Quill.
                    const lineBlots = quillInstance.getLines(rangeIndex, rangeLength || 1);
                    if (lineBlots.length > 0) {
                        const firstNode = lineBlots[0].domNode;
                        const lastNode = lineBlots[lineBlots.length - 1].domNode;
                        const parent = firstNode.parentNode;

                        const temp = document.createElement('div');
                        temp.innerHTML = html;
                        const newNodes = Array.from(temp.childNodes);

                        newNodes.forEach(node => parent.insertBefore(node, firstNode));

                        let node = firstNode;
                        while (node) {
                            const next = node.nextSibling;
                            parent.removeChild(node);
                            if (node === lastNode) break;
                            node = next;
                        }
                    }
                } else {
                    quillInstance.root.innerHTML = html;
                }
            }

            // Ubah grid data sel (array of array of string) jadi HTML <table> biasa.
            function gridToTableHtml(cells) {
                const escapeHtml = (s) => String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                let html = '<table><tbody>';
                cells.forEach(row => {
                    html += '<tr>';
                    row.forEach(cellText => {
                        html += `<td>${escapeHtml(cellText).replace(/\n/g, '<br>')}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                return html;
            }

            // Baca HTML <table> jadi grid data sel (array of array of string), dipakai saat
            // membuka kembali dialog edit tabel. CATATAN: penggabungan kolom (colspan) & format
            // per-sel (bold/italic) dari tabel hasil import Word TIDAK dipertahankan kalau
            // tabelnya diedit ulang lewat dialog ini (disederhanakan jadi teks polos per sel).
            function parseTableHtmlToGrid(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                const table = tmp.querySelector('table');
                const rowsEls = table ? Array.from(table.rows) : [];
                const cells = rowsEls.map(tr => Array.from(tr.cells).map(td => (td.innerText || td.textContent || '')));
                const cols = cells.reduce((m, r) => Math.max(m, r.length), 1);
                cells.forEach(r => { while (r.length < cols) r.push(''); });
                if (cells.length === 0) cells.push(['']);
                return cells;
            }

            // Render grid editor interaktif (tambah/hapus baris & kolom) di dalam elemen
            // dengan id "tableBuilderRoot". `cells` diubah langsung (mutable) supaya
            // nilainya bisa dibaca lagi lewat tombol Simpan/Sisipkan.
            function renderTableBuilderGrid(cells) {
                const root = document.getElementById('tableBuilderRoot');
                if (!root) return;

                const draw = () => {
                    let html = '<div style="overflow:auto; max-height:320px; border:1px solid #eee; padding:6px; margin-bottom:10px; text-align:left;"><table style="border-collapse:collapse;">';
                    cells.forEach((row, r) => {
                        html += '<tr>';
                        row.forEach((val, c) => {
                            const safe = String(val).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            html += `<td style="border:1px solid #ddd; padding:2px;">
                                <textarea data-r="${r}" data-c="${c}" rows="2" style="width:110px; border:1px solid #eee; padding:4px; font-size:12px; resize:vertical; font-family:inherit;">${safe}</textarea>
                            </td>`;
                        });
                        html += `<td style="border:none; padding:2px; vertical-align:middle;"><button type="button" class="btn-del-row" data-r="${r}" title="Hapus baris ini" style="color:#ef4444; font-size:16px; background:none; border:none; cursor:pointer;">🗑️</button></td>`;
                        html += '</tr>';
                    });
                    html += '<tr>';
                    cells[0].forEach((_, c) => {
                        html += `<td style="border:none; text-align:center; padding:2px;"><button type="button" class="btn-del-col" data-c="${c}" title="Hapus kolom ini" style="color:#ef4444; font-size:12px; background:none; border:none; cursor:pointer;">🗑️ kolom</button></td>`;
                    });
                    html += '</tr></table></div>';
                    html += `<div style="display:flex; gap:8px;">
                        <button type="button" id="btnAddTableRow" style="padding:6px 14px; background:#2563eb; color:white; border:none; border-radius:6px; font-size:12px; cursor:pointer;">+ Baris</button>
                        <button type="button" id="btnAddTableCol" style="padding:6px 14px; background:#2563eb; color:white; border:none; border-radius:6px; font-size:12px; cursor:pointer;">+ Kolom</button>
                    </div>`;
                    root.innerHTML = html;

                    root.querySelectorAll('textarea').forEach(ta => {
                        ta.addEventListener('input', () => {
                            cells[parseInt(ta.dataset.r, 10)][parseInt(ta.dataset.c, 10)] = ta.value;
                        });
                    });
                    const addRowBtn = root.querySelector('#btnAddTableRow');
                    if (addRowBtn) addRowBtn.addEventListener('click', () => {
                        cells.push(cells[0].map(() => ''));
                        draw();
                    });
                    const addColBtn = root.querySelector('#btnAddTableCol');
                    if (addColBtn) addColBtn.addEventListener('click', () => {
                        cells.forEach(row => row.push(''));
                        draw();
                    });
                    root.querySelectorAll('.btn-del-row').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (cells.length <= 1) return;
                            cells.splice(parseInt(btn.dataset.r, 10), 1);
                            draw();
                        });
                    });
                    root.querySelectorAll('.btn-del-col').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (cells[0].length <= 1) return;
                            const c = parseInt(btn.dataset.c, 10);
                            cells.forEach(row => row.splice(c, 1));
                            draw();
                        });
                    });
                };
                draw();
            }

            // Modal ringan buatan sendiri (BUKAN Swal.fire) khusus untuk dialog tabel.
            // Ini SENGAJA tidak pakai SweetAlert2 karena dialog tabel ini dibuka DI ATAS
            // popup Tambah/Edit Soal yang JUGA pakai Swal.fire — SweetAlert2 cuma bisa
            // punya 1 popup aktif, jadi kalau dialog tabel juga pakai Swal.fire, popup
            // Tambah/Edit Soal di baliknya akan ikut tertutup/tergantikan (soal yang sudah
            // diketik jadi hilang). Modal kustom ini melayang di atas Swal tanpa menyentuhnya.
            function showTableBuilderModal({ title, cells, showDelete, onConfirm, onDelete, onCancel }) {
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99999; display:flex; align-items:center; justify-content:center; padding:16px;';

                const box = document.createElement('div');
                box.style.cssText = 'background:#fff; border-radius:12px; padding:20px; max-width:700px; width:100%; max-height:85vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,0.35); text-align:left;';
                box.innerHTML = `
                    <h3 style="margin:0 0 12px; font-size:16px; font-weight:bold; color:#1f2937;">${title}</h3>
                    <div id="tableBuilderRoot"></div>
                    <p style="font-size:11px; color:#888; margin:4px 0 10px;">Gunakan tombol "+ Baris"/"+ Kolom" untuk mengubah ukuran tabel.</p>
                    <div id="tbErrorMsg" style="display:none; color:#ef4444; font-size:12px; margin-bottom:10px;"></div>
                    <div style="display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;">
                        ${showDelete ? '<button type="button" id="tbDeleteBtn" style="padding:8px 16px; background:#fee2e2; color:#ef4444; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">🗑️ Hapus Tabel</button>' : ''}
                        <button type="button" id="tbCancelBtn" style="padding:8px 16px; background:#f3f4f6; color:#374151; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Batal</button>
                        <button type="button" id="tbConfirmBtn" style="padding:8px 16px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">${showDelete ? '💾 Simpan Perubahan' : '➕ Sisipkan Tabel'}</button>
                    </div>`;
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                renderTableBuilderGrid(cells);

                // Cegah tombol Escape "bocor" ke listener global SweetAlert2 di baliknya
                // (yang kalau tidak dicegah bisa ikut menutup popup Tambah/Edit Soal).
                // Hanya tombol Escape yang dicegat; tombol lain (termasuk Enter di textarea
                // sel tabel) dibiarkan berjalan normal supaya pengetikan tidak terganggu.
                const escGuard = (e) => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); } };
                document.addEventListener('keydown', escGuard, true);

                const cleanup = () => {
                    document.removeEventListener('keydown', escGuard, true);
                    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                };

                overlay.addEventListener('mousedown', (e) => {
                    if (e.target === overlay) { cleanup(); if (onCancel) onCancel(); }
                });
                box.querySelector('#tbCancelBtn').addEventListener('click', () => { cleanup(); if (onCancel) onCancel(); });
                if (showDelete) {
                    box.querySelector('#tbDeleteBtn').addEventListener('click', () => { cleanup(); if (onDelete) onDelete(); });
                }
                box.querySelector('#tbConfirmBtn').addEventListener('click', () => {
                    if (cells.length === 0 || !cells[0] || cells[0].length === 0) {
                        const err = box.querySelector('#tbErrorMsg');
                        err.textContent = 'Tabel harus punya minimal 1 baris & 1 kolom';
                        err.style.display = 'block';
                        return;
                    }
                    cleanup();
                    onConfirm(cells);
                });
            }

            // Buka dialog tambah/edit tabel untuk satu editor Quill tertentu.
            // `existingId` diisi kalau ini EDIT tabel yang sudah ada (klik 2x placeholder-nya),
            // atau null kalau ini menyisipkan tabel BARU dari tombol toolbar.
            function openTableEditorDialog(quillInstance, existingId) {
                quillInstance.__tableData = quillInstance.__tableData || {};
                quillInstance.__tableSeq = quillInstance.__tableSeq || 0;

                let cells;
                if (existingId && quillInstance.__tableData[existingId]) {
                    cells = parseTableHtmlToGrid(quillInstance.__tableData[existingId]);
                } else {
                    cells = [['', '', ''], ['', '', '']];
                }

                return new Promise((resolve) => {
                    showTableBuilderModal({
                        title: existingId ? '✏️ Edit Tabel' : '➕ Tambah Tabel',
                        cells,
                        showDelete: !!existingId,
                        onCancel: () => resolve(),
                        onDelete: () => {
                            removeTablePlaceholder(quillInstance, existingId);
                            resolve();
                        },
                        onConfirm: (finalCells) => {
                            const tableHtml = gridToTableHtml(finalCells);
                            if (existingId) {
                                quillInstance.__tableData[existingId] = tableHtml;
                            } else {
                                quillInstance.__tableSeq += 1;
                                const newId = 't' + quillInstance.__tableSeq;
                                quillInstance.__tableData[newId] = tableHtml;

                                const placeholder = tablePlaceholderText(newId);
                                const range = quillInstance.getSelection(true) || { index: quillInstance.getLength(), length: 0 };
                                quillInstance.deleteText(range.index, range.length, 'user');
                                quillInstance.insertText(range.index, placeholder + '\n', { bold: true, color: '#2563eb' }, 'user');
                                quillInstance.setSelection(range.index + placeholder.length + 1, 0, 'user');
                            }
                            resolve();
                        }
                    });
                });
            }

            // Hapus placeholder tabel dari teks editor + datanya dari __tableData.
            function removeTablePlaceholder(quillInstance, id) {
                const marker = tablePlaceholderText(id);
                const text = quillInstance.getText();
                const idx = text.indexOf(marker);
                if (idx !== -1) {
                    let len = marker.length;
                    if (text[idx + len] === '\n') len += 1;
                    quillInstance.deleteText(idx, len, 'user');
                }
                if (quillInstance.__tableData) delete quillInstance.__tableData[id];
            }

            // Pasang listener klik-2x pada editor: kalau yang diklik adalah placeholder
            // tabel ("📊 [TABEL xxx] ..."), buka lagi dialog edit untuk tabel tsb.
            function wireTableClickToEdit(quillInstance) {
                quillInstance.root.addEventListener('dblclick', () => {
                    const sel = quillInstance.getSelection();
                    if (!sel) return;
                    const text = quillInstance.getText();
                    const re = /\[TABEL\s+(t\d+)\]/g;
                    let m;
                    while ((m = re.exec(text)) !== null) {
                        const start = m.index;
                        const end = start + m[0].length;
                        if (sel.index >= start && sel.index <= end) {
                            openTableEditorDialog(quillInstance, m[1]);
                            return;
                        }
                    }
                });
            }

            // Dipanggil saat SOAL DISIMPAN: ganti setiap placeholder tabel di HTML hasil
            // editor dengan HTML <table> aslinya (dari __tableData), supaya yang tersimpan
            // ke database adalah tabel sungguhan, bukan teks placeholder-nya.
            function resolveEditorTablesInHtml(editorInstance, html) {
                const data = editorInstance.__tableData || {};
                const ids = Object.keys(data);
                if (ids.length === 0) return html;

                const container = document.createElement('div');
                container.innerHTML = html;
                ids.forEach(id => {
                    const marker = tablePlaceholderText(id).trim();
                    const blocks = Array.from(container.querySelectorAll('p, li'));
                    blocks.forEach(block => {
                        if ((block.textContent || '').trim() === marker) {
                            const tmp = document.createElement('div');
                            tmp.innerHTML = data[id];
                            const tableEl = tmp.querySelector('table');
                            if (tableEl) block.replaceWith(tableEl);
                            else block.remove();
                        }
                    });
                });
                return container.innerHTML;
            }

            // Dipanggil saat soal yang SUDAH ADA dibuka untuk diedit: cari semua <table> di
            // HTML tersimpan, pindahkan datanya ke __tableData, dan gantikan tabelnya dengan
            // placeholder teks di dalam editor (kebalikan dari resolveEditorTablesInHtml).
            function loadHtmlIntoEditorWithTables(editorInstance, html) {
                editorInstance.__tableData = {};
                editorInstance.__tableSeq = 0;

                const container = document.createElement('div');
                container.innerHTML = html || '';

                const allTables = Array.from(container.querySelectorAll('table'));
                // Lewati tabel yang bersarang di dalam tabel lain (kasus sangat jarang & tidak didukung).
                const topLevelTables = allTables.filter(t => !(t.parentElement && t.parentElement.closest('table')));

                topLevelTables.forEach(tableEl => {
                    editorInstance.__tableSeq += 1;
                    const id = 't' + editorInstance.__tableSeq;
                    editorInstance.__tableData[id] = tableEl.outerHTML;

                    const p = document.createElement('p');
                    const strong = document.createElement('strong');
                    strong.style.color = 'rgb(37, 99, 235)';
                    strong.textContent = tablePlaceholderText(id);
                    p.appendChild(strong);
                    tableEl.replaceWith(p);
                });

                editorInstance.root.innerHTML = container.innerHTML;
            }

            // ==========================================================================
            // KONVERSI RUMUS WORD (OMML) -> LATEX, supaya rumus di soal Word ikut terbaca.
            // Dipakai sebagai pengganti mammoth khusus untuk file .docx (mammoth tidak
            // mendukung objek rumus bawaan Word / OMML, sehingga rumus akan hilang kalau
            // hanya lewat mammoth). Hasil akhirnya tetap berupa string HTML <p>...</p>
            // supaya bisa langsung dipakai oleh extractLinesFromWordHtml() yang sudah ada.
            // ==========================================================================

            // Ambil teks polos dari sekumpulan node OMML (dipakai sbg "isi" pangkat/akar/pecahan)
            function ommlChildrenToLatex(node) {
                let out = '';
                for (const child of Array.from(node.children)) {
                    out += ommlNodeToLatex(child);
                }
                return out;
            }

            // Ambil HANYA anak langsung dengan tagName tertentu (bukan cari ke semua turunan),
            // supaya struktur bersarang (pangkat di dalam pangkat, akar di dalam akar, dst)
            // tidak salah ambil elemen dari level yang lebih dalam.
            function directChild(node, tagName) {
                for (const child of Array.from(node.children)) {
                    if (child.tagName === tagName) return child;
                }
                return null;
            }

            function ommlNodeToLatex(node) {
                const tag = node.tagName;
                switch (tag) {
                    case 'm:r': {
                        let t = '';
                        for (const c of Array.from(node.children)) {
                            if (c.tagName === 'm:t') t += c.textContent;
                        }
                        // Normalisasi simbol supaya aman dirender KaTeX
                        return t
                            .replace(/×/g, ' \\times ')
                            .replace(/÷/g, ' \\div ')
                            .replace(/−/g, '-');
                    }
                    case 'm:sSup': {
                        const e = directChild(node, 'm:e');
                        const sup = directChild(node, 'm:sup');
                        return `{${e ? ommlChildrenToLatex(e) : ''}}^{${sup ? ommlChildrenToLatex(sup) : ''}}`;
                    }
                    case 'm:sSub': {
                        const e = directChild(node, 'm:e');
                        const sub = directChild(node, 'm:sub');
                        return `{${e ? ommlChildrenToLatex(e) : ''}}_{${sub ? ommlChildrenToLatex(sub) : ''}}`;
                    }
                    case 'm:f': {
                        const num = directChild(node, 'm:num');
                        const den = directChild(node, 'm:den');
                        return `\\frac{${num ? ommlChildrenToLatex(num) : ''}}{${den ? ommlChildrenToLatex(den) : ''}}`;
                    }
                    case 'm:rad': {
                        const e = directChild(node, 'm:e');
                        const degHideEl = directChild(node, 'm:degHide');
                        const degEl = directChild(node, 'm:deg');
                        const degText = degEl ? ommlChildrenToLatex(degEl).trim() : '';
                        const isHidden = !degText || (degHideEl && degHideEl.getAttribute('m:val') !== '0');
                        const inner = e ? ommlChildrenToLatex(e) : '';
                        return isHidden ? `\\sqrt{${inner}}` : `\\sqrt[${degText}]{${inner}}`;
                    }
                    case 'm:d': {
                        // Objek "Bracket" Word: karakter kurung disimpan di atribut m:val, bukan teks.
                        const dPr = directChild(node, 'm:dPr');
                        let begChr = '(', endChr = ')';
                        if (dPr) {
                            const begEl = directChild(dPr, 'm:begChr');
                            const endEl = directChild(dPr, 'm:endChr');
                            if (begEl) begChr = begEl.getAttribute('m:val') ?? begChr;
                            if (endEl) endChr = endEl.getAttribute('m:val') ?? endChr;
                        }
                        const safeDelim = (c) => (c === '' ? '.' : (c === '{' || c === '}' ? '\\' + c : c));
                        const parts = Array.from(node.children)
                            .filter(c => c.tagName === 'm:e')
                            .map(e => ommlChildrenToLatex(e));
                        return `\\left${safeDelim(begChr)}${parts.join(',\\ ')}\\right${safeDelim(endChr)}`;
                    }
                    default:
                        // elemen pembungkus yang tidak dikenal (mis. m:e langsung) -> masuk ke isinya
                        return ommlChildrenToLatex(node);
                }
            }

            // Ubah 1 elemen <m:oMath> lengkap jadi teks "$...$" siap dipakai KaTeX
            function ommlToLatexString(oMathNode) {
                const latex = ommlChildrenToLatex(oMathNode).trim();
                return latex ? ` \\(${latex}\\) ` : '';
            }

            function escapeHtmlText(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // Ubah 1 run teks biasa (<w:r>) jadi HTML, pertahankan bold/italic, dan ubah
            // <w:br/> jadi <br> supaya baris tetap terpisah sama seperti sebelumnya.
            function wordRunToHtml(rNode) {
                const rPr = rNode.getElementsByTagName('w:rPr')[0];
                let bold = false, italic = false;
                if (rPr) {
                    const bEl = rPr.getElementsByTagName('w:b')[0];
                    const iEl = rPr.getElementsByTagName('w:i')[0];
                    bold = !!bEl && bEl.getAttribute('w:val') !== '0' && bEl.getAttribute('w:val') !== 'false';
                    italic = !!iEl && iEl.getAttribute('w:val') !== '0' && iEl.getAttribute('w:val') !== 'false';
                }
                let html = '';
                for (const child of Array.from(rNode.children)) {
                    if (child.tagName === 'w:t') html += escapeHtmlText(child.textContent || '');
                    else if (child.tagName === 'w:tab') html += '&nbsp;&nbsp;&nbsp;&nbsp;';
                    else if (child.tagName === 'w:br') html += '<br>';
                }
                if (!html) return '';
                if (bold) html = `<strong>${html}</strong>`;
                if (italic) html = `<em>${html}</em>`;
                return html;
            }

            // Ubah 1 paragraf (<w:p>) jadi HTML: gabungan teks biasa + rumus ($...$),
            // gambar (<w:drawing>/<w:pict>) sengaja DILEWATI, sesuai desain semula.
            function wordParagraphToHtml(pNode) {
                let html = '';
                for (const child of Array.from(pNode.children)) {
                    if (child.tagName === 'w:r') {
                        html += wordRunToHtml(child);
                    } else if (child.tagName === 'w:hyperlink') {
                        for (const r of Array.from(child.getElementsByTagName('w:r'))) html += wordRunToHtml(r);
                    } else if (child.tagName === 'm:oMath') {
                        html += ommlToLatexString(child);
                    } else if (child.tagName === 'm:oMathPara') {
                        for (const om of Array.from(child.getElementsByTagName('m:oMath'))) {
                            html += ommlToLatexString(om);
                        }
                    }
                }
                return html;
            }

            function wordTableToHtml(tblNode) {
                const rows = Array.from(tblNode.children).filter(c => c.tagName === 'w:tr');
                let html = '<table><tbody>';
                rows.forEach(tr => {
                    html += '<tr>';
                    const cells = Array.from(tr.children).filter(c => c.tagName === 'w:tc');
                    cells.forEach(tc => {
                        let colSpan = 1;
                        const tcPr = tc.getElementsByTagName('w:tcPr')[0];
                        if (tcPr) {
                            const gridSpanEl = tcPr.getElementsByTagName('w:gridSpan')[0];
                            if (gridSpanEl) {
                                const v = parseInt(gridSpanEl.getAttribute('w:val'), 10);
                                if (v > 1) colSpan = v;
                            }
                        }
                        const paragraphs = Array.from(tc.children).filter(c => c.tagName === 'w:p');
                        const cellHtml = paragraphs.map(p => wordParagraphToHtml(p)).join('<br>');
                        html += `<td${colSpan > 1 ? ` colspan="${colSpan}"` : ''}>${cellHtml}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                return html;
            }

            // Baca file .docx sebagai ZIP (JSZip) -> ambil word/document.xml -> parse XML
            // -> hasilkan string HTML "<p>...</p>" per paragraf (format yang sama dengan
            // keluaran mammoth.convertToHtml), lengkap dengan rumus dalam bentuk $LaTeX$.
            async function convertDocxToHtmlWithEquations(arrayBuffer) {
                const zip = await JSZip.loadAsync(arrayBuffer);
                const xmlFile = zip.file('word/document.xml');
                if (!xmlFile) throw new Error('word/document.xml tidak ditemukan di dalam file .docx');
                const xmlText = await xmlFile.async('text');
                const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');
                if (xmlDoc.getElementsByTagName('parsererror').length) {
                    throw new Error('Gagal parse XML dari file .docx');
                }
                const body = xmlDoc.getElementsByTagName('w:body')[0];
                if (!body) throw new Error('Struktur dokumen .docx tidak valid (w:body tidak ditemukan)');

                const htmlParts = [];
                Array.from(body.children).forEach(node => {
                    if (node.tagName === 'w:p') {
                        htmlParts.push(`<p>${wordParagraphToHtml(node)}</p>`);
                    } else if (node.tagName === 'w:tbl') {
                        htmlParts.push(wordTableToHtml(node));
                    }
                });
                return htmlParts.join('');
            }

            // Panggil KaTeX auto-render pada sebuah elemen supaya teks "\\(...\\)" di dalamnya
            // benar-benar tampil sebagai rumus. Aman dipanggil berkali-kali / elemen kosong.
            function renderMathIn(el) {
                if (!el || typeof renderMathInElement !== 'function') return;
                try {
                    renderMathInElement(el, {
                        delimiters: [
                            { left: '\\[', right: '\\]', display: true },
                            { left: '\\(', right: '\\)', display: false }
                        ],
                        throwOnError: false
                    });
                } catch (e) {
                    console.warn('Gagal render rumus KaTeX:', e);
                }
            }

            // Mengubah HTML hasil konversi Word (mammoth.convertToHtml) menjadi daftar baris.
            // Setiap paragraf (<p>/<li>) DIPECAH LAGI berdasarkan tag <br> di dalamnya, supaya opsi
            // yang diketik pakai Shift+Enter (line break dalam 1 paragraf yang sama) tetap terbaca
            // sebagai baris terpisah, sama seperti opsi yang diketik pakai Enter (paragraf baru).
            //
            // Setiap baris menyimpan DUA hal:
            // `text` = teks polos (dipakai untuk mendeteksi pola "1. ", "a. ", dst via regex)
            // `node` = elemen <div> berisi HTML asli baris tsb — bold (<strong>) & italic (<em>)
            //          tetap ada di sini, karena mammoth memang mengonversi keduanya secara default.
            function extractLinesFromWordHtml(html) {
            const container = document.createElement('div');
            container.innerHTML = html;

            const lines = [];
            // Ambil <table> secara utuh sebagai SATU baris tersendiri (tidak dipecah ke
            // sel/paragraf di dalamnya). <p>/<li> yang berada DI DALAM tabel sengaja
            // dilewati di sini (sudah ikut dalam <table>-nya sendiri), sedangkan <p>/<li>
            // di luar tabel tetap diproses seperti biasa.
            const blockNodes = Array.from(container.querySelectorAll('p, li, table')).filter(el => {
                if (el.tagName === 'TABLE') return true;
                return !el.closest('table');
            });
            blockNodes.forEach(blockNode => {
                if (blockNode.tagName === 'TABLE') {
                    const text = (blockNode.textContent || '').trim();
                    if (!text) return;
                    const tmp = document.createElement('div');
                    tmp.innerHTML = blockNode.outerHTML;
                    lines.push({ text, node: tmp, isTable: true });
                    return;
                }
                const fragments = blockNode.innerHTML.split(/<br\s*\/?>/i);
                fragments.forEach(fragHtml => {
                    const tmp = document.createElement('div');
                    tmp.innerHTML = fragHtml;
                    trimDomWhitespace(tmp);
                    const text = (tmp.textContent || '').trim();
                    if (text) lines.push({ text, node: tmp });
                });
            });
            return lines;
        }

            // Parser inti: mengubah hasil ekstraksi Word (format ASTS) menjadi array soal
            // terstruktur. Bold & italic pada isi soal & opsi tetap dipertahankan
            // (gambar tetap TIDAK diproses/diupload sama sekali, sesuai desain semula).
            function parseWordSoalText(lines) {
                const questionRe = /^(\d+)[\.\)]\s*(.*)$/;      // "1. Teks soal" / "31) Teks soal"
                const optionRe   = /^([a-dA-D])[\.\)]\s*(.*)$/; // "a. Opsi" / "B) Opsi"
                const complexHeaderRe = /pilihan\s*ganda\s*kompleks/i;
                const answerKeyHeaderRe = /^kunci\s*jawaban/i;
                const skipLineRe = /^(asesmen|tahun pelajaran|mata pelajaran|kelas\s*:|waktu\s*:|tanggal\s*:|pilihlah|pilihalah)/i;

                let mainLines = lines;
                let keyLines = [];
                const keyStartIdx = lines.findIndex(l => answerKeyHeaderRe.test(l.text));
                if (keyStartIdx !== -1) {
                    mainLines = lines.slice(0, keyStartIdx);
                    keyLines = lines.slice(keyStartIdx + 1);
                }

                // Bungkus 1 baris HTML (yang sudah mengandung <strong>/<em>) jadi <p>...</p>,
                // SAMA PERSIS seperti format yang dihasilkan editor Quill saat soal dibuat manual.
                const assembleContentHtml = (parts) => {
                    let out = '';
                    let buffer = [];
                    const flush = () => {
                        if (buffer.length) { out += `<p>${buffer.join('<br>')}</p>`; buffer = []; }
                    };
                    parts.forEach(part => {
                        if (/^\s*<table/i.test(part)) { flush(); out += part; }
                        else { buffer.push(part); }
                    });
                    flush();
                    return out;
                };

                const questionsMap = {};
                let currentQ = null;
                let currentOptLetter = null;
                let isComplexSection = false;

                for (const line of mainLines) {
                    const plain = line.text;
                    if (complexHeaderRe.test(plain)) { isComplexSection = true; currentQ = null; currentOptLetter = null; continue; }
                    if (skipLineRe.test(plain)) { continue; }

                    const qMatch = plain.match(questionRe);
                    const oMatch = plain.match(optionRe);

                    if (qMatch) {
                        const num = parseInt(qMatch[1], 10);
                        // Buang prefix "1. " dari HTML (bukan dari teks polos) supaya
                        // bold/italic pada isi soal tetap utuh setelah nomor dibuang.
                        stripLeadingChars(line.node, plain.length - qMatch[2].length);
                        currentQ = {
                            htmlParts: [line.node.innerHTML],
                            options: [],
                            type: isComplexSection ? 'pilihan_ganda_kompleks' : 'pilihan_ganda'
                        };
                        questionsMap[num] = currentQ;
                        currentOptLetter = null;
                    } else if (oMatch && currentQ) {
                        currentOptLetter = oMatch[1].toUpperCase();
                        stripLeadingChars(line.node, plain.length - oMatch[2].length);
                        currentQ.options.push({ htmlParts: [line.node.innerHTML] });
                    } else if (currentQ) {
                        if (currentOptLetter !== null && currentQ.options.length > 0) {
                            currentQ.options[currentQ.options.length - 1].htmlParts.push(line.node.innerHTML);
                        } else {
                            currentQ.htmlParts.push(line.node.innerHTML);
                        }
                    }
                }

                const answerMap = {};
                for (const line of keyLines) {
                    const m = line.text.match(/^(\d+)[\.\)]\s*([A-Da-d](?:\s*[,;/]\s*[A-Da-d])*)/);
                    if (m) {
                        const num = parseInt(m[1], 10);
                        const letters = m[2].toUpperCase().split(/[,;/]/).map(s => s.trim()).filter(Boolean);
                        answerMap[num] = letters.join(',');
                    }
                }

                const results = [];
                const skipped = [];

                Object.keys(questionsMap).sort((a, b) => a - b).forEach(numStr => {
                    const num = parseInt(numStr, 10);
                    const q = questionsMap[num];
                    const rawAnswer = answerMap[num];

                    // Cek isi soal benar-benar tidak kosong (setelah tag HTML dibuang untuk pengecekan)
                    const checkDiv = document.createElement('div');
                    checkDiv.innerHTML = q.htmlParts.join(' ');
                    const isTextEmpty = !(checkDiv.textContent || '').trim();

                    if (isTextEmpty || q.options.length < 2) { skipped.push(num); return; }
                    if (!rawAnswer) { skipped.push(num); return; }

                    // Gabungkan multi-baris (soal/opsi yang lanjut di baris berikutnya) dengan
                    // <br> untuk baris teks, sementara baris berisi <table> tetap jadi blok sendiri.
                    const wrappedQuestionText = assembleContentHtml(q.htmlParts);
                    const wrappedOptions = q.options.map(o => assembleContentHtml(o.htmlParts));

                    let finalAnswerKey;
                    if (q.type === 'pilihan_ganda_kompleks') {
                        // Kunci PG Kompleks tetap berupa daftar huruf ("A,C"), bukan teks opsi,
                        // jadi tidak perlu dibungkus <p> — dicocokkan lewat letterToIndex.
                        finalAnswerKey = rawAnswer;
                    } else {
                        const idx = letterToIndex(rawAnswer.split(',')[0]);
                        if (idx < 0 || idx >= q.options.length) { skipped.push(num); return; }
                        // Ambil dari wrappedOptions (bukan opsi mentah) supaya answer_key
                        // sama persis (termasuk tag <p>) dengan salah satu opsi yang tersimpan.
                        finalAnswerKey = wrappedOptions[idx];
                    }

                    results.push({
                        number: num,
                        question_type: q.type,
                        question_text: wrappedQuestionText,
                        options: wrappedOptions,
                        answer_key: finalAnswerKey
                    });
                });

                return { results, skipped };
            }

            function handleUploadWord(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (typeof JSZip === 'undefined' && typeof mammoth === 'undefined') {
                    Swal.fire('Error', 'Library pembaca Word gagal dimuat. Periksa koneksi internet Anda.', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const arrayBuffer = e.target.result;
                        let html;
                        try {
                            // Jalur utama: parser sendiri berbasis JSZip + XML, supaya rumus
                            // (OMML) ikut terbaca menjadi $LaTeX$, bukan hilang seperti di mammoth.
                            html = await convertDocxToHtmlWithEquations(arrayBuffer);
                        } catch (parseErr) {
                            console.warn('Parser rumus gagal, fallback ke mammoth (rumus TIDAK akan terbaca):', parseErr);
                            if (typeof mammoth === 'undefined') throw parseErr;
                            const result = await mammoth.convertToHtml({ arrayBuffer });
                            html = result.value;
                        }
                        const lines = extractLinesFromWordHtml(html);
                        const { results, skipped } = parseWordSoalText(lines);

                        if (results.length === 0) {
                            Swal.fire(
                                'Tidak Ada Soal Terbaca',
                                'Pastikan format dokumen sesuai template ASTS: nomor soal diikuti opsi a/b/c/d, ' +
                                'dan ada bagian "KUNCI JAWABAN" di akhir dokumen berisi daftar seperti "1. A" atau "31. A, C".',
                                'error'
                            );
                            event.target.value = '';
                            return;
                        }

                        const isGuru = currentUser.role === 'GURU' || currentUser.role === 'guru';
                        const classOptions = (isGuru && currentUser.class)
                            ? `<option value="${currentUser.class}">Kelas ${currentUser.class}</option>`
                            : `<option value="7">Kelas 7</option><option value="8">Kelas 8</option><option value="9">Kelas 9</option>`;
                        const subjectOptions = (isGuru && currentUser.subject)
                            ? `<option value="${currentUser.subject}">${currentUser.subject}</option>`
                            : (typeof SUBJECTS !== 'undefined' ? SUBJECTS : ['Matematika', 'IPA', 'Bahasa Indonesia', 'Bahasa Inggris']).map(s => `<option value="${s}">${s}</option>`).join('');

                        const complexCount = results.filter(r => r.question_type === 'pilihan_ganda_kompleks').length;
                        const simpleCount = results.length - complexCount;

                        const confirmResult = await Swal.fire({
                            title: '📝 Konfirmasi Import Soal dari Word',
                            html: `
                                <div style="text-align:left; font-size:13px;">
                                    <p style="margin-bottom:10px;">Terdeteksi <b>${results.length} soal</b> siap diimpor
                                    (${simpleCount} Pilihan Ganda, ${complexCount} PG Kompleks).
                                    ${skipped.length ? `<br><span style="color:#b45309;">⚠️ ${skipped.length} nomor dilewati (soal/opsi/kunci tidak lengkap): ${skipped.join(', ')}</span>` : ''}
                                    </p>
                                    <label style="display:block; font-weight:bold; margin-bottom:4px;">Jenjang Kelas</label>
                                    <select id="wordImportClass" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; margin-bottom:10px;">${classOptions}</select>
                                    <label style="display:block; font-weight:bold; margin-bottom:4px;">Mata Pelajaran</label>
                                    <select id="wordImportSubject" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">${subjectOptions}</select>
                                </div>
                            `,
                            showCancelButton: true,
                            confirmButtonText: '🚀 Import Sekarang',
                            cancelButtonText: 'Batal',
                            preConfirm: () => ({
                                targetClass: document.getElementById('wordImportClass').value,
                                targetSubject: document.getElementById('wordImportSubject').value
                            })
                        });

                        if (!confirmResult.isConfirmed) { event.target.value = ''; return; }

                        const { targetClass, targetSubject } = confirmResult.value;

                        showLoading();
                        let successCount = 0;
                        let errorCount = 0;

                        for (const q of results) {
                            const payload = {
                                question_class: String(targetClass),
                                subject: targetSubject,
                                question_type: q.question_type,
                                question_text: q.question_text,
                                options: JSON.stringify(q.options),
                                answer_key: q.answer_key
                            };

                            const { error } = await dbClient.from('questions').insert([payload]);
                            if (error) {
                                console.error(`Gagal simpan soal nomor ${q.number}:`, error.message);
                                errorCount++;
                            } else {
                                successCount++;
                            }
                        }

                        hideLoading();
                        Swal.fire(
                            'Import Selesai',
                            `Berhasil menambahkan: <b>${successCount} soal</b>.<br>Gagal: <b>${errorCount} soal</b>.` +
                            (skipped.length ? `<br>Dilewati karena tidak lengkap: <b>${skipped.length} soal</b> (nomor: ${skipped.join(', ')}).` : ''),
                            successCount > 0 ? 'success' : 'error'
                        );

                        event.target.value = '';

                        if (typeof loadExamData === 'function') {
                            await loadExamData(true);
                            renderQuestionsSection();
                        }

                    } catch (err) {
                        console.error('Terjadi kesalahan membaca file Word:', err);
                        hideLoading();
                        Swal.fire('Error', 'Gagal memproses file Word. Pastikan file berformat .docx dan sesuai template.', 'error');
                        event.target.value = '';
                    }
                };

                reader.readAsArrayBuffer(file);
            }

            // FITUR DOWNLOAD & UPLOAD SOAL EXCEL (URUTAN HEADER BARU & PREMIUM LAYOUT)

            // 2. Download Soal dengan Filter Kelas & Mapel (Anti-Crash + Interaktif)
            function downloadSoalExcel() {

                    const uniqueSubjects = [...new Set(accessibleQuestions.map(q => q.subject).filter(Boolean))];

                    // 3. Tampilkan Dialog Pemilihan Filter sebelum mendownload
                    Swal.fire({
                        title: 'Download Excel (Pilihan Filter)',
                        html: `
                            <div style="text-align: left; font-family: sans-serif;">
                                <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Silakan sesuaikan data bank soal yang ingin Anda ekspor ke Excel di bawah ini:</p>
                                
                                <div style="margin-bottom: 15px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">1. Filter Kelas:</label>
                                    <select id="swalFilterClass" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white;">
                                        <option value="ALL">✨ Semua Tingkat Kelas</option>
                                        <option value="7">Kelas 7</option>
                                        <option value="8">Kelas 8</option>
                                        <option value="9">Kelas 9</option>
                                    </select>
                                </div>
                                
                                <div style="margin-bottom: 10px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">2. Filter Mata Pelajaran / Bab:</label>
                                    <select id="swalFilterSubject" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white;">
                                        <option value="ALL">✨ Semua Mapel / Bab</option>
                                        ${uniqueSubjects.map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        `,
                        showCancelButton: true,

                        cancelButtonText: 'Batal',
                        confirmButtonColor: '#3085d6',
                        cancelButtonColor: '#d33',
                        preConfirm: () => {
                            return {
                                selectedClass: document.getElementById('swalFilterClass').value,
                                selectedSubject: document.getElementById('swalFilterSubject').value
                            }
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            const { selectedClass, selectedSubject } = result.value;

                            // 4. Lakukan penyaringan akhir berdasarkan input filter user
                            let finalSoal = accessibleQuestions.filter(q => {
                                const grade = q.question_class ? String(q.question_class).charAt(0) : '';
