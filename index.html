                                const matchSubject = (selectedSubject === 'ALL' || q.subject === selectedSubject);
                                
                                return matchClass && matchSubject;
                            });

                            // Jika hasil filter kosong
                            if (finalSoal.length === 0) {
                                Swal.fire('Tidak Ditemukan', 'Tidak ada data soal yang cocok dengan kombinasi filter tersebut.', 'warning');
                                return;
                            }

                            // 5. Format ulang data (dengan proteksi ukuran base64 gambar)
                            const formattedData = finalSoal.map(q => {
                                let answer = '';
                                try {
                                    answer = decodeURIComponent(escape(atob(q.security_token)));
                                } catch(e) {
                                    answer = q.answer_key || '';
                                }

                                let opts = q.options;
                                if (typeof opts !== 'string') {
                                    opts = JSON.stringify(opts || []);
                                }
                                
                                let htmlText = q.question_text || '';
                                if (htmlText.length > 32000) {
                                    htmlText = htmlText.replace(/src="data:image\/[^;]+;base64,[^"]+"/g, 'src="[GAMBAR_DIHAPUS_KARENA_UKURAN_TERLALU_BESAR]"');
                                }

                                return {
                                    "question_class": q.question_class || '',
                                    "subject": q.subject || '',
                                    "question_type": q.question_type || 'pilihan_ganda',
                                    "question_text": htmlText,
                                    "question_image": (q.question_image && q.question_image.length > 32000) ? 'URL Gambar Terlalu Panjang' : (q.question_image || ''),
                                    "options": opts,
                                    "answer_key": answer
                                };
                            });

                            // 6. Generate lembar kerja Excel
                            const ws = XLSX.utils.json_to_sheet(formattedData, { 
                                header: ["question_class", "subject", "question_type", "question_text", "question_image", "options", "answer_key"] 
                            });
                            
                            ws['!cols'] = [
                                {wch: 15}, {wch: 18}, {wch: 16}, {wch: 60}, {wch: 25}, {wch: 30}, {wch: 15}
                            ];
                            ws['!autofilter'] = { ref: `A1:G${formattedData.length + 1}` };

                            const wb = XLSX.utils.book_new();
                            XLSX.utils.book_append_sheet(wb, ws, "Backup_Bank_Soal");

                            // Kustomisasi nama file dinamis agar mencerminkan filter yang dipilih
                            const nameClass = selectedClass === 'ALL' ? 'SemuaKelas' : `Kelas_${selectedClass}`;
                            const nameSub = selectedSubject === 'ALL' ? 'SemuaMapel' : selectedSubject.replace(/[^a-zA-Z0-9]/g, '_');
                            
                            XLSX.writeFile(wb, `Backup_Soal_${nameClass}_${nameSub}_${new Date().getTime()}.xlsx`);
                            
                            // Beri tanda sukses
                            Swal.fire({
                                icon: 'success',
                                title: 'Berhasil Didownload',
                                text: `Berhasil mengekspor ${finalSoal.length} soal ke file Excel!`,
                                timer: 2000,
                                showConfirmButton: false
                            });
                        }
                    });
                } catch (error) {
                    console.error("Gagal mendownload excel:", error);
                    Swal.fire('Error', 'Sistem gagal memproses filter download.', 'error');
                }
            }

            // ==================================================================
            // FITUR BARU: DOWNLOAD SOAL DALAM FORMAT WORD (.docx) SIAP CETAK
            // ==================================================================

            // ------------------------------------------------------------------
            // PARSER LATEX -> EQUATION ASLI WORD (OMML), bisa diklik & diedit di Word.
            // Mendukung: pecahan (\frac), akar (\sqrt, \sqrt[n]{}), pangkat (^),
            // indeks bawah (_), gabungan pangkat+indeks, huruf Yunani, dan simbol umum.
            // Kalau ada bentuk yang tidak dikenali/terlalu rumit, akan otomatis
            // "gagal" dengan aman dan sistem akan mundur memakai versi gambar.
            // ------------------------------------------------------------------
            const LATEX_GREEK = {
                alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε', zeta: 'ζ',
                eta: 'η', theta: 'θ', vartheta: 'ϑ', iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν',
                xi: 'ξ', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', upsilon: 'υ', phi: 'φ', varphi: 'φ',
                chi: 'χ', psi: 'ψ', omega: 'ω',
                Alpha: 'Α', Beta: 'Β', Gamma: 'Γ', Delta: 'Δ', Epsilon: 'Ε', Zeta: 'Ζ', Eta: 'Η', Theta: 'Θ',
                Iota: 'Ι', Kappa: 'Κ', Lambda: 'Λ', Mu: 'Μ', Nu: 'Ν', Xi: 'Ξ', Pi: 'Π', Rho: 'Ρ', Sigma: 'Σ',
                Tau: 'Τ', Upsilon: 'Υ', Phi: 'Φ', Chi: 'Χ', Psi: 'Ψ', Omega: 'Ω'
            };
            const LATEX_SYMBOLS = {
                times: '×', cdot: '⋅', div: '÷', pm: '±', mp: '∓', leq: '≤', le: '≤', geq: '≥', ge: '≥',
                neq: '≠', ne: '≠', approx: '≈', equiv: '≡', sim: '∼', infty: '∞', partial: '∂',
                rightarrow: '→', to: '→', Rightarrow: '⇒', leftarrow: '←', leftrightarrow: '↔',
                in: '∈', notin: '∉', ni: '∋', forall: '∀', exists: '∃', therefore: '∴', because: '∵',
                cup: '∪', cap: '∩', subset: '⊂', supset: '⊃', subseteq: '⊆', supseteq: '⊇',
                emptyset: '∅', varnothing: '∅', angle: '∠', perp: '⊥', parallel: '∥', deg: '°',
                ldots: '…', cdots: '⋯', dots: '…', sum: '∑', prod: '∏', int: '∫', sqrt: '√',
                circ: '∘', propto: '∝', langle: '⟨', rangle: '⟩', vert: '|', Vert: '‖',
                lceil: '⌈', rceil: '⌉', lfloor: '⌊', rfloor: '⌋', quad: '  ', qquad: '    ',
                prime: '′'
            };

            function findMatchingBraceIdx(str, openIdx) {
                let depth = 0;
                for (let k = openIdx; k < str.length; k++) {
                    if (str[k] === '{') depth++;
                    else if (str[k] === '}') { depth--; if (depth === 0) return k; }
                }
                return str.length;
            }

            // Ubah teks LaTeX menjadi array MathComponent (docx.MathRun / MathFraction / MathRadical / dst).
            function latexToMathComponents(latex) {
                let i = 0;
                const nodes = [];
                let textBuf = '';

                const flushText = () => { if (textBuf) { nodes.push(new docx.MathRun(textBuf)); textBuf = ''; } };

                // Ambil "satu unit" berikutnya sebagai string mentah: grup {...}, satu perintah \xxx, atau satu karakter.
                const readUnit = () => {
                    while (latex[i] === ' ') i++;
                    if (latex[i] === '{') {
                        const close = findMatchingBraceIdx(latex, i);
                        const inner = latex.slice(i + 1, close);
                        i = close + 1;
                        return inner;
                    } else if (latex[i] === '\\') {
                        let j = i + 1;
                        if (/[{}%$_^\\&#]/.test(latex[j] || '')) { const s = '\\' + latex[j]; i = j + 1; return s; }
                        let name = '';
                        while (j < latex.length && /[a-zA-Z]/.test(latex[j])) { name += latex[j]; j++; }
                        const s = '\\' + name;
                        i = j;
                        return s;
                    } else if (i < latex.length) {
                        const c = latex[i]; i++; return c;
                    }
                    return '';
                };

                const popLastAsBase = () => {
                    if (textBuf.length > 0) {
                        const lastChar = textBuf.slice(-1);
                        textBuf = textBuf.slice(0, -1);
                        flushText();
                        return [new docx.MathRun(lastChar)];
                    } else if (nodes.length > 0) {
                        const last = nodes.pop();
                        return (last && last.__group) ? last.nodes : [last];
                    }
                    return [new docx.MathRun('')];
                };

                while (i < latex.length) {
                    const ch = latex[i];

                    if (ch === '\\') {
                        let j = i + 1;
                        if (/[{}%$_^\\&#]/.test(latex[j] || '')) { textBuf += latex[j]; i = j + 1; continue; }
                        let name = '';
                        while (j < latex.length && /[a-zA-Z]/.test(latex[j])) { name += latex[j]; j++; }
                        i = j;
                        while (latex[i] === ' ') i++;

                        if (name === 'frac' || name === 'dfrac' || name === 'tfrac' || name === 'cfrac') {
                            flushText();
                            const num = readUnit();
                            const den = readUnit();
                            nodes.push(new docx.MathFraction({ numerator: latexToMathComponents(num), denominator: latexToMathComponents(den) }));
                            continue;
                        }
                        if (name === 'sqrt') {
                            flushText();
                            let degree = null;
                            if (latex[i] === '[') {
                                const close = latex.indexOf(']', i);
                                if (close === -1) throw new Error('sqrt tanpa penutup ]');
                                degree = latex.slice(i + 1, close);
                                i = close + 1;
                            }
                            const rad = readUnit();
                            const opts = { children: latexToMathComponents(rad) };
                            if (degree !== null) opts.degree = latexToMathComponents(degree);
                            nodes.push(new docx.MathRadical(opts));
                            continue;
                        }
                        if (name === 'text' || name === 'mathrm' || name === 'operatorname' || name === 'mathbf' || name === 'textbf') {
                            flushText();
                            const t = readUnit();
                            nodes.push(new docx.MathRun(t));
                            continue;
                        }
                        if (name === 'left' || name === 'right') {
                            let delim = '';
                            if (latex[i] === '\\') {
                                let k = i + 1;
                                if (/[{}]/.test(latex[k] || '')) { delim = latex[k]; i = k + 1; }
                                else {
                                    let dn = '';
                                    while (k < latex.length && /[a-zA-Z]/.test(latex[k])) { dn += latex[k]; k++; }
                                    delim = LATEX_SYMBOLS[dn] || '';
                                    i = k;
                                }
                            } else if (latex[i] === '.') { i++; }
                            else { delim = latex[i]; i++; }
                            if (delim) textBuf += delim;
                            continue;
                        }
                        if (name === '' ) { continue; } // command tak dikenal tanpa nama, lewati
                        if (LATEX_GREEK[name]) { textBuf += LATEX_GREEK[name]; continue; }
                        if (LATEX_SYMBOLS[name] !== undefined) { textBuf += LATEX_SYMBOLS[name]; continue; }
                        // perintah tak dikenal: gagal total supaya seluruh rumus fallback ke gambar (lebih aman)
                        throw new Error('Perintah LaTeX tidak didukung: \\' + name);
                    }

                    if (ch === '{') {
                        const close = findMatchingBraceIdx(latex, i);
                        const inner = latex.slice(i + 1, close);
                        flushText();
                        nodes.push({ __group: true, nodes: latexToMathComponents(inner) });
                        i = close + 1;
                        continue;
                    }

                    if (ch === '}') { i++; continue; } // penutup nyasar, lewati saja

                    if (ch === '^' || ch === '_') {
                        const isSup = ch === '^';
                        i++;
                        const scriptRaw = readUnit();
                        const scriptNodes = latexToMathComponents(scriptRaw);

                        // Cek apakah langsung diikuti pasangannya (mis. x_1^2) supaya jadi satu
                        // elemen gabungan pangkat+indeks yang rapi, bukan bertumpuk.
                        let k = i;
                        while (latex[k] === ' ') k++;
                        let otherNodes = null;
                        if (latex[k] === (isSup ? '_' : '^')) {
                            i = k + 1;
                            const otherRaw = readUnit();
                            otherNodes = latexToMathComponents(otherRaw);
                        }

                        const base = popLastAsBase();
                        if (otherNodes) {
                            nodes.push(new docx.MathSubSuperScript({
                                children: base,
                                subScript: isSup ? otherNodes : scriptNodes,
                                superScript: isSup ? scriptNodes : otherNodes
                            }));
                        } else if (isSup) {
                            nodes.push(new docx.MathSuperScript({ children: base, superScript: scriptNodes }));
                        } else {
                            nodes.push(new docx.MathSubScript({ children: base, subScript: scriptNodes }));
                        }
                        continue;
                    }

                    textBuf += ch;
                    i++;
                }
                flushText();

                // Ratakan grup {...} yang tidak terpakai sebagai basis pangkat/indeks
                const flat = [];
                for (const n of nodes) {
                    if (n && n.__group) flat.push(...n.nodes);
                    else flat.push(n);
                }
                return flat;
            }

            // Coba ubah rumus jadi Equation ASLI Word (bisa diedit). Kalau gagal / tidak didukung,
            // otomatis pakai versi gambar (fallback) supaya rumus tetap tampil dengan benar.
            async function latexToMathOrImageRun(latex, displayMode) {
                try {
                    if (typeof docx.Math !== 'function') throw new Error('docx.Math tidak tersedia');
                    const comps = latexToMathComponents(latex.trim());
                    if (!comps || comps.length === 0) throw new Error('Hasil parsing kosong');
                    return new docx.Math({ children: comps });
                } catch (e) {
                    console.warn('Rumus dibuat sebagai gambar (bukan equation asli) karena:', latex, e.message);
                    return await latexToImageRun(latex, displayMode);
                }
            }

            // Panaskan/pastikan font KaTeX (untuk akar, pecahan, pangkat, dll) sudah benar-benar
            // selesai diunduh & siap dipakai SEBELUM kita mulai "memotret" rumus jadi gambar.
            // Kalau ini dilewati, hasil screenshot rumus bisa berantakan (huruf tumpang tindih,
            // garis akar/pecahan hilang atau salah posisi) karena font-nya belum termuat sempurna.
            let _katexFontsWarmed = false;
            async function warmUpKatexFonts() {
                if (_katexFontsWarmed || typeof katex === 'undefined') return;
                const warm = document.createElement('div');
                warm.style.position = 'fixed';
                warm.style.left = '-99999px';
                warm.style.top = '0';
                warm.style.fontSize = '20px';
                document.body.appendChild(warm);
                try {
                    katex.render('\\sqrt{\\frac{a^{2}+b^{2}}{c}}', warm, { throwOnError: false, displayMode: true });
                } catch (e) { /* abaikan */ }
                try {
                    if (document.fonts && document.fonts.ready) await document.fonts.ready;
                } catch (e) { /* abaikan */ }
                // beri sedikit jeda tambahan untuk memastikan browser selesai me-layout font barunya
                await new Promise(r => setTimeout(r, 150));
                if (warm.parentNode) warm.parentNode.removeChild(warm);
                _katexFontsWarmed = true;
            }

            // Ubah 1 rumus LaTeX ("\\(...\\)" / "\\[...\\]") menjadi gambar (ImageRun) via KaTeX + html2canvas
            // (dipakai sebagai CADANGAN kalau latexToMathComponents gagal memparsing rumusnya)
            async function latexToImageRun(latex, displayMode) {
                let holder;
                try {
                    if (typeof katex === 'undefined') throw new Error('KaTeX belum siap dimuat');
                    await warmUpKatexFonts();

                    holder = document.createElement('div');
                    holder.style.position = 'fixed';
                    holder.style.left = '-99999px';
                    holder.style.top = '0';
                    holder.style.display = 'inline-block';
                    holder.style.whiteSpace = 'nowrap';
                    holder.style.background = '#ffffff';
                    holder.style.padding = '3px 4px';
                    holder.style.fontSize = '20px';
                    holder.style.lineHeight = 'normal';
                    holder.style.color = '#000000';
                    document.body.appendChild(holder);

                    katex.render(latex, holder, { throwOnError: false, displayMode: !!displayMode });

                    // Beri browser waktu untuk selesai me-layout ulang rumus sebelum ditangkap
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                    const scale = 3;
                    const canvas = await html2canvas(holder, { backgroundColor: '#ffffff', scale, useCORS: true });

                    const dataUrl = canvas.toDataURL('image/png');
                    const buffer = await (await fetch(dataUrl)).arrayBuffer();

                    let width = canvas.width / scale;
                    let height = canvas.height / scale;
                    const maxW = 260;
                    if (width > maxW) { height = height * (maxW / width); width = maxW; }
                    if (width < 1) width = 1;
                    if (height < 1) height = 1;

                    return new docx.ImageRun({ data: buffer, transformation: { width, height } });
                } catch (e) {
                    console.warn('Gagal render rumus ke gambar, fallback ke teks biasa:', latex, e);
                    return new docx.TextRun({ text: latex });
                } finally {
                    if (holder && holder.parentNode) holder.parentNode.removeChild(holder);
                }
            }

            // Ubah <img src="..."> (base64 atau URL) menjadi ImageRun docx, dibatasi lebar maksimal
            async function imgToImageRun(src, maxWidth) {
                try {
                    const buffer = await (await fetch(src)).arrayBuffer();
                    const dims = await new Promise((resolve) => {
                        const im = new Image();
                        im.onload = () => resolve({ w: im.naturalWidth || 300, h: im.naturalHeight || 200 });
                        im.onerror = () => resolve({ w: 300, h: 200 });
                        im.src = src;
                    });
                    let w = dims.w, h = dims.h;
                    const cap = maxWidth || 350;
                    if (w > cap) { h = h * (cap / w); w = cap; }
                    return new docx.ImageRun({ data: buffer, transformation: { width: w, height: h } });
                } catch (e) {
                    console.warn('Gagal memuat gambar untuk file Word:', e);
                    return null;
                }
            }

            // Susuri 1 node HTML (misalnya isi <p> dari editor Quill) menjadi array run docx
            // (TextRun / ImageRun / Math), sambil menjaga format bold/italic/underline serta mengubah
            // rumus "$...$" menjadi Equation (atau gambar) dan tag <img> menjadi gambar juga.
            async function htmlNodeToRuns(node, fmt) {
                fmt = fmt || { bold: false, italics: false, underline: false };
                let runs = [];
                for (const child of Array.from(node.childNodes)) {
                    if (child.nodeType === Node.TEXT_NODE) {
                        const text = child.textContent;
                        if (!text) continue;
                        const regex = /\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)/g;
                        let lastIndex = 0;
                        let match;
                        while ((match = regex.exec(text)) !== null) {
                            if (match.index > lastIndex) {
                                const plain = text.slice(lastIndex, match.index);
                                if (plain) runs.push(new docx.TextRun({ text: plain, bold: fmt.bold, italics: fmt.italics, underline: fmt.underline ? {} : undefined }));
                            }
                            const isDisplay = !!match[1];
                            const latex = (match[1] || match[2] || '').trim();
                            if (latex) runs.push(await latexToMathOrImageRun(latex, isDisplay));
                            lastIndex = regex.lastIndex;
                        }
                        if (lastIndex < text.length) {
                            const plain = text.slice(lastIndex);
                            if (plain) runs.push(new docx.TextRun({ text: plain, bold: fmt.bold, italics: fmt.italics, underline: fmt.underline ? {} : undefined }));
                        }
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        const tag = child.tagName.toLowerCase();
                        if (tag === 'img') {
                            const src = child.getAttribute('src');
                            if (src) {
                                const imgRun = await imgToImageRun(src, 350);
                                if (imgRun) runs.push(imgRun);
                            }
                            continue;
                        }
                        if (tag === 'br') {
                            runs.push(new docx.TextRun({ text: '', break: 1 }));
                            continue;
                        }
                        const nextFmt = {
                            bold: fmt.bold || tag === 'strong' || tag === 'b',
                            italics: fmt.italics || tag === 'em' || tag === 'i',
                            underline: fmt.underline || tag === 'u'
                        };
                        runs = runs.concat(await htmlNodeToRuns(child, nextFmt));
                    }
                }
                return runs;
            }

            // Ubah 1 elemen <table> (dari editor Quill / hasil import Word) jadi docx.Table,
            // lengkap dengan bold/italic/rumus di tiap sel lewat htmlNodeToRuns yang sama
            // dipakai paragraf biasa. Mendukung colspan sederhana.
            async function htmlTableToDocxTable(tableEl) {
                const rows = Array.from(tableEl.rows || []);
                if (rows.length === 0) return null;

                const docRows = [];
                for (const tr of rows) {
                    const cells = Array.from(tr.cells || []);
                    const docCells = [];
                    for (const cell of cells) {
                        const runs = await htmlNodeToRuns(cell, {});
                        const paragraph = new docx.Paragraph({ children: runs.length ? runs : [new docx.TextRun({ text: '' })] });
                        const cellOpts = { children: [paragraph], margins: { top: 60, bottom: 60, left: 80, right: 80 } };
                        const colSpan = parseInt(cell.getAttribute('colspan') || '1', 10);
                        if (colSpan > 1) cellOpts.columnSpan = colSpan;
                        docCells.push(new docx.TableCell(cellOpts));
                    }
                    if (docCells.length) docRows.push(new docx.TableRow({ children: docCells }));
                }
                if (docRows.length === 0) return null;

                const borderStyle = { style: docx.BorderStyle.SINGLE, size: 4, color: '999999' };
                return new docx.Table({
                    rows: docRows,
                    width: { size: 100, type: docx.WidthType.PERCENTAGE },
                    borders: {
                        top: borderStyle, bottom: borderStyle, left: borderStyle, right: borderStyle,
                        insideHorizontal: borderStyle, insideVertical: borderStyle
                    }
                });
            }

            // Ubah HTML (boleh berisi lebih dari satu <p>) menjadi ARRAY paragraf docx siap pakai.
            // `prefixRuns` (misal nomor soal "1." atau huruf opsi "a.") hanya ditambahkan di paragraf pertama.
            // `indentCfg` = { textIndent, numberIndent } dalam twips (1 cm = 567 twips):
            //   - numberIndent: posisi nomor/huruf (mis. "1." atau "a.")
            //   - textIndent  : posisi mulai teks setelah tab, dan posisi baris lanjutan/paragraf berikutnya
            // Ini membuat baris kedua & seterusnya (kalau teks panjang / soal punya beberapa paragraf)
            // sejajar dengan TEKS, bukan turun lagi ke bawah nomor/huruf.
            async function htmlToDocxParagraphs(html, prefixRuns, indentCfg) {
                const container = document.createElement('div');
                container.innerHTML = html || '';
                // <p>/<li> DI DALAM <table> sengaja dilewati (sudah ikut dalam <table>-nya
                // sendiri), sementara <table> sendiri ditangani lewat htmlTableToDocxTable.
                let blocks = Array.from(container.querySelectorAll('p, li, table')).filter(el => {
                    if (el.tagName === 'TABLE') return true;
                    return !el.closest('table');
                });
                if (blocks.length === 0) blocks = [container];

                const textIndent = indentCfg ? indentCfg.textIndent : 0;
                const numberIndent = indentCfg ? indentCfg.numberIndent : 0;
                const hangingAmount = textIndent - numberIndent;

                const nodes = [];
                let isFirstTextBlock = true; // hanya blok teks pertama yang dapat prefixRuns (nomor/huruf) & indentasi gantung
                for (let i = 0; i < blocks.length; i++) {
                    const block = blocks[i];
                    if (block.tagName === 'TABLE') {
                        const table = await htmlTableToDocxTable(block);
                        if (table) {
                            nodes.push(table);
                            nodes.push(new docx.Paragraph({ spacing: { after: 80 } }));
                        }
                        continue;
                    }
                    const runs = await htmlNodeToRuns(block, {});
                    const children = isFirstTextBlock ? [...(prefixRuns || []), ...runs] : runs;
                    if (children.length === 0) children.push(new docx.TextRun({ text: '' }));

                    const paragraphOpts = { children, spacing: { after: 80 } };
                    if (indentCfg) {
                        if (isFirstTextBlock) {
                            paragraphOpts.indent = { left: textIndent, hanging: hangingAmount > 0 ? hangingAmount : 0 };
                            paragraphOpts.tabStops = [{ type: docx.TabStopType.LEFT, position: textIndent }];
                        } else {
                            paragraphOpts.indent = { left: textIndent };
                        }
                    }
                    nodes.push(new docx.Paragraph(paragraphOpts));
                    isFirstTextBlock = false;
                }
                return nodes;
            }

            function getOptionsArray(q) {
                let opts = q.options;
                try {
                    if (typeof opts === 'string' && opts.trim() !== '') opts = JSON.parse(opts);
                } catch (e) { opts = []; }
                if (!Array.isArray(opts)) opts = [];
                return opts.filter(o => o !== undefined && o !== null && String(o).trim() !== '');
            }

            // Pastikan library docx & html2canvas benar-benar sudah siap sebelum dipakai.
            // Kalau gagal dimuat lewat CDN utama (mis. lambat / sempat gagal saat load halaman),
            // coba lagi sekali lagi termasuk lewat CDN cadangan (unpkg) sebelum benar-benar menyerah.
            function loadScriptOnce(src) {
                return new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = () => resolve(true);
                    s.onerror = () => reject(new Error('Gagal memuat ' + src));
                    document.head.appendChild(s);
                });
            }
            async function ensureWordLibsReady() {
                if (typeof docx === 'undefined') {
                    try { await loadScriptOnce('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js'); } catch (e) { /* lanjut coba cadangan */ }
                }
                if (typeof docx === 'undefined') {
                    try { await loadScriptOnce('https://unpkg.com/docx@8.5.0/build/index.umd.js'); } catch (e) { /* biarkan, akan dicek lagi di bawah */ }

                                    <input id="wordJudul" type="text" value="ASESMEN SUMATIF" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">
                                </div>
                                <div style="margin-bottom:10px;">

                                    <input id="wordTahun" type="text" value="TAHUN PELAJARAN 2026/2027" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">
                                </div>
                                <div style="display:flex; gap:8px;">
                                    <div style="flex:1;">
                                        <label style="display:block; font-weight:bold; margin-bottom:4px;">Tanggal:</label>
                                        <input id="wordTanggal" type="text" placeholder="23 September 2026" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;">

                        `,

                        confirmButtonText: '🚀 Buat File Word',

                        cancelButtonColor: '#d33',
                        preConfirm: () => ({
                            selectedClass: document.getElementById('wordFilterClass').value,

                            waktu: document.getElementById('wordWaktu').value || '-'

                    });

                    if (!formValues) return;
                    const { selectedClass, selectedSubject, judul, tahun, tanggal, waktu } = formValues;

                    let finalSoal = accessibleQuestions.filter(q => {
                        const grade = q.question_class ? String(q.question_class).charAt(0) : '';
                        const matchClass = (selectedClass === 'ALL' || grade === selectedClass);
                        const matchSubject = (selectedSubject === 'ALL' || q.subject === selectedSubject);
                        return matchClass && matchSubject;
                    });

                    if (finalSoal.length === 0) {
                        Swal.fire('Tidak Ditemukan', 'Tidak ada data soal yang cocok dengan kombinasi filter tersebut.', 'warning');
                        return;
                    }

                    showLoading();

                    const groups = {
                        pilihan_ganda: finalSoal.filter(q => q.question_type === 'pilihan_ganda' || !q.question_type),
                        pilihan_ganda_kompleks: finalSoal.filter(q => q.question_type === 'pilihan_ganda_kompleks'),
                        benar_salah: finalSoal.filter(q => q.question_type === 'benar_salah'),
                        isian_singkat: finalSoal.filter(q => q.question_type === 'isian_singkat')
                    };

                    const sectionDefs = [
                        { key: 'pilihan_ganda', heading: 'Pilihan Ganda', instruksi: 'Pilihlah salah satu jawaban a, b, c atau d yang paling benar!' },
                        { key: 'pilihan_ganda_kompleks', heading: 'Pilihan Ganda Kompleks', instruksi: 'Pilihlah jawaban yang benar (jawaban benar bisa lebih dari satu)!' },
                        { key: 'benar_salah', heading: 'Benar / Salah', instruksi: 'Berilah tanda centang pada kolom BENAR atau SALAH sesuai pernyataan berikut!' },

                    ];

                    const headerChildren = [];
                    headerChildren.push(new docx.Paragraph({
                        alignment: docx.AlignmentType.CENTER,
                        children: [new docx.TextRun({ text: judul.toUpperCase(), bold: true })]
                    }));
                    if (tahun) {
                        headerChildren.push(new docx.Paragraph({
                            alignment: docx.AlignmentType.CENTER,
                            children: [new docx.TextRun({ text: tahun.toUpperCase(), bold: true })]
                        }));
                    }
                    headerChildren.push(new docx.Paragraph({}));
                    headerChildren.push(new docx.Paragraph({
                        children: [new docx.TextRun({ text: `Mata Pelajaran\t\t: ${selectedSubject === 'ALL' ? '-' : selectedSubject}\t\t\t\t\tTanggal\t: ${tanggal}` })]
                    }));
                    headerChildren.push(new docx.Paragraph({
                        children: [new docx.TextRun({ text: `Kelas\t\t\t: ${selectedClass === 'ALL' ? 'Semua Kelas' : selectedClass}\t\t\t\t\tWaktu\t: ${waktu}` })]
                    }));
                    headerChildren.push(new docx.Paragraph({}));

                    const bodyChildren = [];

                    // Indentasi gantung: nomor/huruf di posisi awal, teks (dan baris lanjutannya / paragraf
                    // berikutnya kalau soal lebih dari satu baris) sejajar rapi di posisi berikut.
                    // Nilainya sengaja dibuat kecil (satuan twips, 567 twips = 1 cm) karena halaman dibuat 2 kolom.
                    const QUESTION_INDENT = { numberIndent: 0, textIndent: 300 };
                    const OPTION_INDENT = { numberIndent: 300, textIndent: 580 };

                    let nomor = 1;
                    for (const sec of sectionDefs) {
                        const list = groups[sec.key];
                        if (!list || list.length === 0) continue;

                        bodyChildren.push(new docx.Paragraph({ children: [new docx.TextRun({ text: sec.heading, bold: true })] }));
                        bodyChildren.push(new docx.Paragraph({
                            children: [new docx.TextRun({ text: sec.instruksi, italics: true })],
                            spacing: { after: 150 }
                        }));

                        for (const q of list) {
                            const numberRuns = [new docx.TextRun({ text: `${nomor}.\t` })];
                            const qParagraphs = await htmlToDocxParagraphs(q.question_text || '', numberRuns, QUESTION_INDENT);
                            bodyChildren.push(...qParagraphs);

                            if (q.question_image) {
                                const imgRun = await imgToImageRun(q.question_image, 260);
                                if (imgRun) bodyChildren.push(new docx.Paragraph({ children: [imgRun], indent: { left: QUESTION_INDENT.textIndent } }));
                            }

                            const opts = getOptionsArray(q);
                            if (sec.key === 'isian_singkat') {
                                bodyChildren.push(new docx.Paragraph({
                                    children: [new docx.TextRun({ text: 'Jawab: ....................................' })],
                                    indent: { left: QUESTION_INDENT.textIndent },
                                    spacing: { after: 150 }
                                }));
                            } else if (sec.key === 'benar_salah' && opts.length === 0) {
                                bodyChildren.push(new docx.Paragraph({
                                    children: [new docx.TextRun({ text: '(   )  Benar     (   )  Salah' })],
                                    indent: { left: QUESTION_INDENT.textIndent },
                                    spacing: { after: 150 }
                                }));
                            } else if (opts.length === 0) {
                                bodyChildren.push(new docx.Paragraph({ spacing: { after: 150 } }));
                            } else {
                                for (let idx = 0; idx < opts.length; idx++) {
                                    const label = String.fromCharCode(97 + idx);
                                    const prefixRuns = [new docx.TextRun({ text: `${label}.\t` })];
                                    const optParagraphs = await htmlToDocxParagraphs(String(opts[idx]), prefixRuns, OPTION_INDENT);
                                    bodyChildren.push(...optParagraphs);
                                }
                                bodyChildren.push(new docx.Paragraph({ spacing: { after: 100 } }));
                            }
                            nomor++;
                        }
                    }

                    const doc = new docx.Document({
                        sections: [
                            {
                                properties: {
                                    page: { margin: { top: 850, bottom: 850, left: 850, right: 850 } }
                                },
                                children: headerChildren
                            },
                            {
                                properties: {
                                    type: docx.SectionType.CONTINUOUS, // supaya lanjut di kertas yang sama, tidak pindah halaman baru
                                    column: { count: 2, space: 350 },
                                    page: { margin: { top: 850, bottom: 850, left: 850, right: 850 } }
                                },
                                children: bodyChildren
                            }
                        ]
                    });

                    const blob = await docx.Packer.toBlob(doc);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const namaFile = `Soal_${(selectedSubject === 'ALL' ? 'SemuaMapel' : selectedSubject).replace(/[^a-zA-Z0-9]/g, '_')}_Kelas${selectedClass === 'ALL' ? 'Semua' : selectedClass}.docx`;
                    a.href = url;
                    a.download = namaFile;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    hideLoading();
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: `File Word berisi ${finalSoal.length} soal berhasil dibuat.`,
                        timer: 2200,
                        showConfirmButton: false
                    });

                } catch (error) {
                    console.error('Gagal membuat file Word:', error);
                    hideLoading();
                    Swal.fire('Error', 'Gagal membuat file Word: ' + (error.message || 'Terjadi kesalahan'), 'error');
                }
            }

            // 4. Proses File Excel yang Diupload ke Database
            function handleUploadSoal(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const rows = XLSX.utils.sheet_to_json(worksheet);

                        if (rows.length === 0) {
                            Swal.fire('Error', 'File Excel kosong atau format tidak sesuai!', 'error');
                            return;
                        }

                        showLoading();
                        let successCount = 0;
                        let errorCount = 0;

                        // Bungkus teks polos jadi <p>...</p> supaya format sama persis dengan
                        // soal yang dibuat manual lewat editor Quill (jika teks SUDAH mengandung
                        // tag HTML, biarkan apa adanya — jangan dibungkus dobel).
                        const wrapPIfPlain = (str) => {
                            const s = String(str == null ? '' : str).trim();
                            if (s === '') return s;
                            return /<\/?[a-z][\s\S]*>/i.test(s) ? s : `<p>${s}</p>`;
                        };

                        for (const row of rows) {
                            let finalOptions = [];
                            
                            // Membaca kolom options tunggal dari excel
                            if (row['options']) {
                                try {
                                    // Jika diisi format JSON valid seperti '["A", "B"]'
                                    finalOptions = JSON.parse(row['options']);
                                } catch (e) {
                                    // Jika guru mengetik manual biasa dipisahkan koma (e.g., "Benar, Salah")
                                    finalOptions = String(row['options']).split(',').map(o => o.trim());
                                }
                            }
                            finalOptions = finalOptions.map(o => wrapPIfPlain(o));

                            // Kunci jawaban: huruf tunggal/daftar huruf (A / A,C) dibiarkan huruf besar
                            // seperti semula, tapi kunci berupa TEKS OPSI PENUH (dari file backup hasil
                            // export) tidak boleh di-uppercase, dan harus dibungkus <p> jika masih polos —
                            // supaya sama persis dengan salah satu elemen options di atas.
                            const rawKey = String(row['answer_key'] || '').trim();
                            const isLetterKey = /^[A-Da-d](\s*[,;/]\s*[A-Da-d])*$/.test(rawKey);
                            const finalAnswerKey = isLetterKey ? rawKey.toUpperCase() : wrapPIfPlain(rawKey);

                            const payload = {
                                question_class: String(row['question_class'] || ''),
                                subject: row['subject'],
                                question_type: row['question_type'] || 'pilihan_ganda',
                                question_text: wrapPIfPlain(row['question_text']),
                                question_image: row['question_image'] || null, // Mendukung upload URL gambar jika ada
                                options: JSON.stringify(finalOptions), 
                                answer_key: finalAnswerKey
                            };

                            // Validasi data baris minimal harus punya mata pelajaran dan teks soal
                            if (payload.subject && payload.question_text) {
                                const { error } = await dbClient.from('questions').insert([payload]);
                                if (error) {
                                    console.error('Gagal simpan baris soal:', error.message);
                                    errorCount++;
                                } else {
                                    successCount++;
                                }
                            } else {
                                errorCount++; 
                            }
                        }

                        hideLoading();
                        Swal.fire(
                            'Upload Selesai', 
                            `Berhasil menambahkan: <b>${successCount} soal</b>.<br>Gagal/Kosong: <b>${errorCount} soal</b>.`, 
                            successCount > 0 ? 'success' : 'error'
                        );
                        
                        event.target.value = ''; // Reset input file
                        
                        if (typeof loadExamData === 'function') {
                            await loadExamData(true); 
                            renderQuestionsSection();
                        }

                    } catch (err) {
                        console.error('Terjadi kesalahan pembacaan excel:', err);
                        hideLoading();
                        Swal.fire('Error', 'Gagal memproses susunan file Excel.', 'error');
                    }
                };
                
                reader.readAsArrayBuffer(file);
            }

                            opt3: new Quill('#add-opt-3', config)
                        };
                        Object.keys(window.addEditors).forEach(key => {
                            wireTableClickToEdit(window.addEditors[key]);
                        });
                        attachDialogSelectionTracker(window.addEditors.question);

                        const typeSelect = document.getElementById('add-type');
                        const handleUIChange = () => {
                            const type = typeSelect.value || 'pilihan_ganda';
                            const isBS = type === 'benar_salah';
                            const isPG = type === 'pilihan_ganda';
                            const isComplex = type === 'pilihan_ganda_kompleks';
                            const isEssay = type === 'isian_singkat';

                            // Kontrol visibilitas Opsi C dan D
                            document.getElementById('cont-opt-2').style.display = (isPG || isComplex) ? 'block' : 'none';
                            document.getElementById('cont-opt-3').style.display = (isPG || isComplex) ? 'block' : 'none';
                            document.getElementById('drop-opt-2').style.display = isPG ? 'block' : 'none';
                            document.getElementById('drop-opt-3').style.display = isPG ? 'block' : 'none';
                            document.getElementById('options-wrapper').style.display = isEssay ? 'none' : 'block';

                            const useDropdown = isPG || isBS;
                            document.getElementById('key-dropdown-container').style.display = useDropdown ? 'block' : 'none';
                            document.getElementById('key-manual-container').style.display = useDropdown ? 'none' : 'block';

                            // Auto-fill Benar/Salah
                            if (isBS) {
                                window.addEditors.opt0.root.innerHTML = '<p>Benar</p>';
                                window.addEditors.opt1.root.innerHTML = '<p>Salah</p>';
                            }

                            document.getElementById('key-hint-text').textContent = isComplex ? "*Gunakan koma (Contoh: A, C)" : (isEssay ? "*Ketik jawaban singkat" : "*Pilih huruf jawaban benar");
                        };

                        typeSelect.addEventListener('change', handleUIChange);
                        handleUIChange();
                    },
                    showCancelButton: true,
                    confirmButtonText: '💾 Simpan Soal',
                    confirmButtonColor: '#10B981',
                    preConfirm: async () => {

                        // Ambil langsung dari element HTML. Meskipun HTML-nya disabled, value tetap bisa dibaca dengan aman.
                        // Jika kosong, berikan string '-' agar Supabase tidak error karena null.
                        const qClass = document.getElementById('add-class').value || '-';
                        const qSubject = document.getElementById('add-subject').value || '-';
                        
                        try {
                            const type = document.getElementById('add-type').value || 'pilihan_ganda';
                            const processEditor = async (ed) => {
                                const imgs = ed.root.querySelectorAll('img');
                                for (let img of imgs) {
                                    if (img.src.startsWith('data:image') && typeof compressImage === 'function') {
                                        img.src = await compressImage(img.src);
                                    }
                                }
                                return resolveEditorTablesInHtml(ed, ed.root.innerHTML);
                            };

                            Swal.showLoading();
                            const qText = await processEditor(window.addEditors.question);
                            let finalOptions = [], key = "";

                            if (type !== 'isian_singkat') {
                                // Ambil semua input mentah
                                const rawOptions = [
                                    await processEditor(window.addEditors.opt0),
                                    await processEditor(window.addEditors.opt1),
                                    await processEditor(window.addEditors.opt2),
                                    await processEditor(window.addEditors.opt3)
                                ];

                                // --- LOGIKA UTAMA: Potong Opsi jika Benar/Salah ---
                                if (type === 'benar_salah') {
                                    finalOptions = rawOptions.slice(0, 2); // Hanya simpan A dan B
                                } else {
                                    finalOptions = rawOptions; // Simpan semua A, B, C, D
                                }

                                // Penentuan Kunci
                                if (type === 'pilihan_ganda' || type === 'benar_salah') {
                                    const selectedIdx = document.getElementById('select-correct-opt').value;
                                    key = finalOptions[selectedIdx]; 
                                } else if (type === 'pilihan_ganda_kompleks') {
                                    key = document.getElementById('manual-key-input').value.toUpperCase().replace(/\s+/g, '').split(',').filter(k => k !== '').join(',');
                                    if (!key) throw new Error("Kunci jawaban kompleks harus diisi");
                                } else {
                                    key = document.getElementById('manual-key-input').value;
                                }
                            } else {
                                key = document.getElementById('manual-key-input').value.trim();
                            }

                            // PAYLOAD SUPABASE
                            const payload = {
                                question_text: qText || '',
                                question_class: String(qClass),
                                subject: String(qSubject),
                                question_type: String(type),
                                options: JSON.stringify(finalOptions || []), 
                                answer_key: String(key || '')
                            };

                            // Lakukan Insert ke Supabase
                            const { data, error } = await dbClient
                                .from('questions')
                                .insert([payload])
                                .select();

                            if (error) throw new Error(error.message);

                            // Mengembalikan data beserta ID auto-increment dari Supabase
                            return { ...payload, id: data[0].id, security_token: btoa(unescape(encodeURIComponent(key))) };
                        } catch (err) {
                            Swal.showValidationMessage(`Gagal: ${err.message}`);
                        }
                    }
                }).then(async result => {
                    if (result.isConfirmed && result.value) {
                        
                        // Memanggil dari Supabase diam-diam agar tabel soal terupdate akurat
                        if (typeof loadExamData === 'function') {
                            await loadExamData(true);
                        } else {
                            if (typeof allQuestions !== 'undefined') {
                                allQuestions.push({
                                    ...result.value,
                                    options: result.value.options ? JSON.parse(result.value.options) : [],
                                    correct_answer: result.value.answer_key
                                });
                            }
                        }

                        // Jalankan Toast sukses
                        showToast('Soal berhasil ditambahkan!', 'success');

                        // --- PERBAIKAN DI SINI ---
                        // Panggil fungsi render utama (Otomatis menyesuaikan Role)
                        if (typeof renderQuestionsSection === 'function') {
                            renderQuestionsSection();
                        }
                        // -------------------------
                    }
                });
            }
