<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#006400">
  <title>Alamat Ujian Telah Pindah</title>
  <!-- 1) Cadangan jika JavaScript mati -->
  <meta http-equiv="refresh" content="8;url=https://ysm-exam.pages.dev">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; font-family: Arial, sans-serif; color: #1f2937;
      background: linear-gradient(to bottom, #003300 0%, #006400 35%, #ffffff 35%);
    }
    .card {
      width: 100%; max-width: 440px; background: #fff; border-radius: 20px; padding: 28px 24px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); border: 1px solid #e5e7eb;
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
      background: #fef3c7; display: flex; align-items: center; justify-content: center; font-size: 32px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #004d00; }
    p { margin: 0 0 14px; font-size: .95rem; line-height: 1.5; color: #4b5563; }
    .url {
      display: block; padding: 10px 12px; margin-bottom: 14px; background: #f3f4f6; border-radius: 10px;
      font-weight: bold; font-size: .9rem; color: #006400; word-break: break-all; text-decoration: none;
    }
    .btn {
      display: block; width: 100%; padding: 12px; border-radius: 10px; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #006400, #004d00); color: #fff; font-weight: bold;
      font-size: 1rem; text-decoration: none;
    }
    .count { margin-top: 14px; font-size: .85rem; color: #6b7280; }
    .note { margin-top: 10px; font-size: .8rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🔔</div>
    <h1>Link Ujian Ini Sudah Tidak Digunakan</h1>
    <p>Aplikasi ujian telah pindah ke alamat baru. Silakan gunakan alamat berikut:</p>

    <!-- 2) Tampilan alamat baru -->
    <a class="url" id="newUrl" href="https://ysm-exam.pages.dev">link baru</a>
    <a class="btn" id="goBtn" href="https://ysm-exam.pages.dev">Buka Link Baru Sekarang</a>

    <div class="count">Anda akan dialihkan otomatis dalam <b id="sec">8</b> detik.</div>
    <div class="note">Simpan atau perbarui bookmark / pintasan layar utama Anda ke alamat baru.</div>
    <noscript><p class="note">JavaScript nonaktif. Klik tombol di atas untuk membuka link baru.</p></noscript>
  </main>

  <script>
    // 3) Alamat tujuan
    var TARGET = "https://ysm-exam.pages.dev";
    var detik = 8;

    // Hitung mundur lalu alihkan
    var timer = setInterval(function () {
      detik--;
      var el = document.getElementById("sec");
      if (el) el.textContent = detik;
      if (detik <= 0) {
        clearInterval(timer);
        window.location.replace(TARGET);
      }
    }, 1000);

    // Daftarkan SW pembersih agar cache lama di perangkat siswa terhapus.
    // Jeda 8 detik di atas memberi waktu SW terunduh sebelum pengalihan.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" })
        .then(function (reg) { return reg.update(); })
        .catch(function () {});
    }
  </script>
</body>
</html>
